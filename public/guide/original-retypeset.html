 ห้องคอมพิวเตอร์หรืออาคารเดียว</text><text xml:space="preserve" x="55.688" y="283.500" textLength="30.251" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="9.900" font-weight="600" fill="#20333a">WLAN</text><text xml:space="preserve" x="184.371" y="283.500" textLength="196.614" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="9.900" font-weight="400" fill="#20333a">LAN ที่ใช้การสื่อสารไร้สาย เช่น Wi-Fi ในโรงเรียน</text><text xml:space="preserve" x="55.688" y="311.250" textLength="24.586" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="9.900" font-weight="600" fill="#20333a">WAN</text><text xml:space="preserve" x="184.371" y="311.250" textLength="222.723" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="9.900" font-weight="400" fill="#20333a">เชื่อมพื้นที่ห่างกัน เช่น เครือข่ายระหว่างสาขาต่างจังหวัด</text><text xml:space="preserve" x="55.688" y="339.000" textLength="95.041" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="9.900" font-weight="600" fill="#20333a">Internet / Intranet</text><text xml:space="preserve" x="184.371" y="339.000" textLength="301.548" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="9.900" font-weight="400" fill="#20333a">Internet เชื่อมเครือข่ายทั่วโลก ส่วน Intranet ใช้งานภายในองค์กรตามสิทธิ์</text><text xml:space="preserve" x="55.688" y="366.000" textLength="66.384" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="9.900" font-weight="600" fill="#20333a">Client–server</text><text xml:space="preserve" x="184.371" y="366.000" textLength="261.017" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="9.900" font-weight="400" fill="#20333a">Client ส่งคำขอ ส่วน Server ให้บริการ เช่น เบราว์เซอร์ขอหน้าเว็บ</text><text xml:space="preserve" x="55.688" y="393.750" textLength="63.600" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="9.900" font-weight="600" fill="#20333a">Peer-to-peer</text><text xml:space="preserve" x="184.371" y="393.750" textLength="276.951" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="9.900" font-weight="400" fill="#20333a">อุปกรณ์มีบทบาทรับและให้บริการกันได้ เช่น การกระจายไฟล์บางระบบ</text><text xml:space="preserve" x="48.188" y="431.250" textLength="143.465" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="12.750" font-weight="600" fill="#245b83">อุปกรณ์ที่ต้องแยกให้ออก</text><text xml:space="preserve" x="48.188" y="453.750" textLength="36.287" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.650" font-weight="600" fill="#20333a">Switch</text><text xml:space="preserve" x="84.480" y="453.750" textLength="268.689" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.650" font-weight="400" fill="#20333a"> เชื่อมอุปกรณ์ใน LAN และส่งเฟรมตาม MAC address ที่เรียนรู้ </text><text xml:space="preserve" x="353.168" y="453.750" textLength="36.494" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.650" font-weight="600" fill="#20333a">Router</text><text xml:space="preserve" x="389.660" y="453.750" textLength="153.824" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.650" font-weight="400" fill="#20333a"> ส่งแพ็กเก็ตระหว่างเครือข่ายตาม IP</text><text xml:space="preserve" x="48.188" y="471.000" textLength="82.220" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.650" font-weight="400" fill="#20333a">และตารางเส้นทาง </text><text xml:space="preserve" x="130.406" y="471.000" textLength="66.963" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.650" font-weight="600" fill="#20333a">Access Point</text><text xml:space="preserve" x="197.367" y="471.000" textLength="159.599" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.650" font-weight="400" fill="#20333a"> ให้เครื่องไร้สายเข้าถึงเครือข่าย ส่วน </text><text xml:space="preserve" x="356.965" y="471.000" textLength="68.338" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.650" font-weight="600" fill="#20333a">Modem/ONT</text><text xml:space="preserve" x="425.309" y="471.000" textLength="104.236" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.650" font-weight="400" fill="#20333a"> ทำหน้าที่เชื่อมต่อกับสื่อ</text><text xml:space="preserve" x="48.188" y="488.250" textLength="194.204" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.650" font-weight="400" fill="#20333a">หรือระบบของผู้ให้บริการตามชนิดอินเทอร์เน็ต</text><text xml:space="preserve" x="48.188" y="513.750" textLength="493.677" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.650" font-weight="400" fill="#20333a">กล่อง Wi-Fi ที่บ้านอาจรวม Router, Switch, Access Point และบริการ DHCP ไว้ในเครื่องเดียว ต้องตอบตามหน้าที่ที่</text><text xml:space="preserve" x="48.188" y="531.000" textLength="407.365" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.650" font-weight="400" fill="#20333a">โจทย์ถาม Hub แบบเก่าส่งข้อมูลออกทุกพอร์ตที่เกี่ยวข้อง จึงต่างจาก Switch ที่เรียนรู้ปลายทาง</text><text xml:space="preserve" x="60.938" y="565.500" textLength="56.415" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.650" font-weight="600" fill="#20333a">สถานการณ์</text><text xml:space="preserve" x="60.938" y="588.750" textLength="466.537" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.650" font-weight="400" fill="#20333a">ห้องเรียนมีคอมพิวเตอร์ 20 เครื่อง ต้องต่อสายเข้าหากัน ใช้ Switch หากต้องออกไปเครือข่ายอื่นต้องมี Router</text><text xml:space="preserve" x="60.938" y="606.000" textLength="239.317" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.650" font-weight="400" fill="#20333a">และถ้าจะให้แท็บเล็ตต่อ Wi-Fi ต้องมี Access Point ด้วย</text><text xml:space="preserve" x="48.188" y="644.250" textLength="226.032" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="12.750" font-weight="600" fill="#245b83">Bandwidth, throughput และ latency</text><text xml:space="preserve" x="48.188" y="666.750" textLength="489.792" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.650" font-weight="400" fill="#20333a">Bandwidth คือความจุช่องทางตามเงื่อนไขที่กำหนด Throughput คืออัตราข้อมูลที่ส่งได้จริง ส่วน Latency คือเวลา</text><text xml:space="preserve" x="48.188" y="684.000" textLength="493.657" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.650" font-weight="400" fill="#20333a">หน่วง การประชุมออนไลน์ต้องสนใจความหน่วงและความแปรปรวนของความหน่วงด้วย ความเร็วสูงเพียงอย่างเดียวจึง</text><text xml:space="preserve" x="48.188" y="701.250" textLength="121.838" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.650" font-weight="400" fill="#20333a">อธิบายคุณภาพทั้งหมดไม่ได้</text><text xml:space="preserve" x="60.938" y="735.000" textLength="452.246" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.005" font-weight="400" fill="#20333a">Topology แบบดาวมีอุปกรณ์ศูนย์กลาง ถ้าสายของเครื่องหนึ่งเสียมักกระทบเครื่องนั้น แต่ถ้า Switch ศูนย์กลางเสีย</text><text xml:space="preserve" x="60.938" y="751.500" textLength="170.703" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.005" font-weight="400" fill="#20333a">อุปกรณ์ที่ต่ออยู่ย่อมสื่อสารผ่านจุดนั้นไม่ได้</text></svg><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 594.9600 841.9200"><rect x="48.000" y="42.750" width="498.750" height="2.250" fill="#347fb5"/><rect x="48.000" y="193.500" width="111.000" height="27.000" fill="#eaf4fb"/><rect x="159.000" y="193.500" width="387.750" height="27.000" fill="#eaf4fb"/><rect x="48.000" y="219.750" width="111.000" height="0.750" fill="#c6dce9"/><rect x="159.000" y="219.750" width="387.750" height="0.750" fill="#c6dce9"/><rect x="48.000" y="276.000" width="111.000" height="0.750" fill="#c6dce9"/><rect x="159.000" y="276.000" width="387.750" height="0.750" fill="#c6dce9"/><rect x="48.000" y="303.000" width="111.000" height="0.750" fill="#c6dce9"/><rect x="159.000" y="303.00 ml:space="preserve" x="166.184" y="293.250" textLength="124.889" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="9.622" font-weight="400" fill="#20333a">Loopback ใช้ติดต่อเครื่องตัวเอง</text><text xml:space="preserve" x="55.688" y="320.250" textLength="75.846" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="9.622" font-weight="600" fill="#20333a">169.254.0.0/16</text><text xml:space="preserve" x="166.184" y="320.250" textLength="259.886" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="9.622" font-weight="400" fill="#20333a">IPv4 link-local ใน Windows อาจพบเมื่อรับค่าจาก DHCP ไม่สำเร็จ</text><text xml:space="preserve" x="55.688" y="347.250" textLength="79.713" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="9.622" font-weight="600" fill="#20333a">Default gateway</text><text xml:space="preserve" x="166.184" y="347.250" textLength="282.927" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="9.622" font-weight="400" fill="#20333a">เราเตอร์ที่เครื่องใช้ส่งข้อมูลเมื่อปลายทางอยู่นอกเครือข่ายตามเส้นทางที่มี</text><text xml:space="preserve" x="48.188" y="384.000" textLength="104.216" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="12.750" font-weight="600" fill="#245b83">อ่าน /24 และ /26</text><text xml:space="preserve" x="48.188" y="405.750" textLength="492.591" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.350" font-weight="400" fill="#20333a">สัญลักษณ์ /24 หมายถึง 24 บิตแรกเป็นส่วน Network เหลือ 8 บิตสำหรับที่อยู่ในเครือข่าย จึงมี 2⁸ = 256 ที่อยู่ สำหรับ</text><text xml:space="preserve" x="48.188" y="423.000" textLength="496.765" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.350" font-weight="400" fill="#20333a">subnet IPv4 ทั่วไปจะสงวน Network address และ Broadcast address เหลือ 254 เครื่อง สูตรนี้มีข้อยกเว้นสำหรับ /31</text><text xml:space="preserve" x="48.188" y="440.250" textLength="35.635" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.350" font-weight="400" fill="#20333a">และ /32</text><text xml:space="preserve" x="60.938" y="474.000" textLength="95.124" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.350" font-weight="600" fill="#20333a">ตัวอย่างคำนวณ /26</text><text xml:space="preserve" x="60.938" y="496.500" textLength="266.832" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.350" font-weight="400" fill="#20333a">192.168.1.64/26 เหลือ 6 บิต จึงมี 64 ที่อยู่ ตั้งแต่ .64 ถึง .127</text><text xml:space="preserve" x="60.938" y="513.000" textLength="112.254" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.350" font-weight="400" fill="#20333a">Network = 192.168.1.64</text><text xml:space="preserve" x="60.938" y="530.250" textLength="124.792" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.350" font-weight="400" fill="#20333a">Broadcast = 192.168.1.127</text><text xml:space="preserve" x="60.938" y="547.500" textLength="204.239" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.350" font-weight="400" fill="#20333a">ช่วงเครื่องใช้งานทั่วไป = .65–.126 รวม 62 ที่อยู่</text><text xml:space="preserve" x="60.938" y="564.000" textLength="150.273" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.350" font-weight="400" fill="#20333a">Subnet mask = 255.255.255.192</text><text xml:space="preserve" x="48.188" y="603.000" textLength="138.066" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="12.750" font-weight="600" fill="#245b83">NAT และการตัดสินใจส่ง</text><text xml:space="preserve" x="48.188" y="624.750" textLength="495.015" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.350" font-weight="400" fill="#20333a">NAT แปลงที่อยู่เครือข่าย ส่วนแบบที่แปลงพอร์ตด้วยช่วยให้หลายเครื่องใช้ Public IP ร่วมกัน เครื่องต้นทางตรวจว่าปลาย</text><text xml:space="preserve" x="48.188" y="641.250" textLength="481.322" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.350" font-weight="400" fill="#20333a">ทางอยู่ subnet เดียวกันหรือไม่ ถ้าอยู่ LAN เดียวกันจะค้นหาที่อยู่ลิงก์ของปลายทาง ถ้าข้ามเครือข่ายจะส่งเฟรมไปหา</text><text xml:space="preserve" x="48.188" y="658.500" textLength="39.358" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.350" font-weight="400" fill="#20333a">Gateway</text><text xml:space="preserve" x="48.188" y="683.250" textLength="21.400" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.350" font-weight="600" fill="#20333a">ARP</text><text xml:space="preserve" x="69.598" y="683.250" textLength="467.703" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.350" font-weight="400" fill="#20333a"> ใช้ค้นหา MAC ที่ตรงกับ IPv4 ภายในลิงก์ เมื่อส่งไปเว็บไซต์ต่างเครือข่าย เครื่องจึงต้องรู้ MAC ของ Gateway ใน</text><text xml:space="preserve" x="48.188" y="699.750" textLength="168.333" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.350" font-weight="400" fill="#20333a">LAN ส่วน IPv6 ใช้ Neighbor Discovery</text><text xml:space="preserve" x="60.938" y="733.500" textLength="461.621" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="9.727" font-weight="400" fill="#20333a">IP ของสองเครื่องขึ้นต้นเหมือนกันยังสรุปว่าอยู่ subnet เดียวกันไม่ได้ ต้องพิจารณา subnet mask ด้วย และ Private IP</text><text xml:space="preserve" x="60.938" y="749.250" textLength="291.279" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="9.727" font-weight="400" fill="#20333a">172.x.x.x ไม่ได้ครอบคลุมทุกค่า x แต่ช่วง private คือ 172.16 ถึง 172.31</text></svg><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 594.9600 841.9200"><rect x="48.000" y="42.750" width="498.750" height="2.250" fill="#347fb5"/><rect x="48.000" y="195.750" width="107.250" height="27.750" fill="#eaf4fb"/><rect x="155.250" y="195.750" width="252.750" height="27.750" fill="#eaf4fb"/><rect x="408.000" y="195.750" width="138.750" height="27.750" fill="#eaf4fb"/><rect x="48.00 hAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.100" font-weight="400" fill="#20333a">MFA ใช้ปัจจัยต่างประเภท เช่น สิ่งที่รู้ (รหัสผ่าน) สิ่งที่มี (อุปกรณ์หรือกุญแจความปลอดภัย) และสิ่งที่เป็น (ชีว</text><text xml:space="preserve" x="48.188" y="380.250" textLength="491.123" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.100" font-weight="400" fill="#20333a">มิติ) รหัสผ่านกับคำถามลับยังเป็นปัจจัยความรู้ประเภทเดียวกัน ปัจจัยหลายชนิดเพิ่มความยากในการยึดบัญชี แต่</text><text xml:space="preserve" x="48.188" y="398.250" textLength="146.795" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.100" font-weight="400" fill="#20333a">ต้องเลือกและใช้อย่างถูกต้อง [4]</text><text xml:space="preserve" x="48.188" y="423.750" textLength="473.199" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.100" font-weight="400" fill="#20333a">Least privilege ให้สิทธิ์เท่าที่จำเป็นต่อหน้าที่ RBAC จัดสิทธิ์ตามบทบาท เช่น ผู้เรียน ครู ผู้ดูแล การเปลี่ยน</text><text xml:space="preserve" x="48.188" y="442.500" textLength="430.257" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.100" font-weight="400" fill="#20333a">หน้าที่หรือออกจากองค์กรควรปรับหรือถอนสิทธิ์ และบัญชีผู้ดูแลควรใช้เฉพาะงานที่ต้องใช้สิทธิ์นั้น</text><text xml:space="preserve" x="48.188" y="473.250" textLength="245.119" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="12.750" font-weight="600" fill="#245b83">Encryption, Hash และ Digital signature</text><text xml:space="preserve" x="48.188" y="496.500" textLength="122.716" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.100" font-weight="600" fill="#20333a">Symmetric encryption</text><text xml:space="preserve" x="170.906" y="496.500" textLength="335.333" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.100" font-weight="400" fill="#20333a"> ใช้กุญแจลับร่วมกันสำหรับเข้ารหัสและถอดรหัส เหมาะกับข้อมูลปริมาณมาก</text><text xml:space="preserve" x="48.188" y="514.500" textLength="143.778" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.100" font-weight="600" fill="#20333a">Asymmetric cryptography</text><text xml:space="preserve" x="191.965" y="514.500" textLength="335.512" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.100" font-weight="400" fill="#20333a"> ใช้คู่กุญแจ public/private ตามขั้นตอนของระบบ เช่น ช่วยตกลงกุญแจหรือ</text><text xml:space="preserve" x="48.188" y="532.500" textLength="95.616" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.100" font-weight="400" fill="#20333a">สร้างลายมือชื่อดิจิทัล</text><text xml:space="preserve" x="48.188" y="558.000" textLength="27.944" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.100" font-weight="600" fill="#20333a">Hash</text><text xml:space="preserve" x="76.137" y="558.000" textLength="468.537" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.100" font-weight="400" fill="#20333a"> แปลงข้อมูลเป็นค่าขนาดที่กำหนดเพื่อใช้ตรวจความเปลี่ยนแปลง ระบบรหัสผ่านควรใช้วิธี hashing สำหรับ</text><text xml:space="preserve" x="48.188" y="576.750" textLength="241.111" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.100" font-weight="400" fill="#20333a">รหัสผ่านร่วมกับ salt และค่าความยากที่เหมาะสม ส่วน </text><text xml:space="preserve" x="289.301" y="576.750" textLength="92.873" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.100" font-weight="600" fill="#20333a">Digital signature</text><text xml:space="preserve" x="382.172" y="576.750" textLength="153.144" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.100" font-weight="400" fill="#20333a"> ใช้กุญแจส่วนตัวลงนามและกุญแจ</text><text xml:space="preserve" x="48.188" y="594.750" textLength="403.148" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.100" font-weight="400" fill="#20333a">สาธารณะตรวจสอบ เพื่อช่วยตรวจความถูกต้องและแหล่งที่มาภายใต้ความเชื่อถือของกุญแจ</text><text xm t-size="10.950" font-weight="400" fill="#20333a">เป็นข้อมูลนับ ระดับความพึงพอใจมีลำดับ และเวลาเดินทางเป็นข้อมูลเชิงปริมาณที่มีศูนย์แท้</text><text xml:space="preserve" x="48.188" y="641.250" textLength="101.095" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="12.750" font-weight="600" fill="#245b83">Big Data และ 5V</text><text xml:space="preserve" x="48.188" y="663.750" textLength="490.352" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.950" font-weight="400" fill="#20333a">Volume คือปริมาณข้อมูล Velocity คือความเร็วที่ข้อมูลเกิดหรือไหลเข้า Variety คือความหลากหลายของรูปแบบ</text><text xml:space="preserve" x="48.188" y="681.750" textLength="494.742" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.950" font-weight="400" fill="#20333a">Veracity คือความน่าเชื่อถือ และ Value คือคุณค่าที่นำไปใช้ การมีข้อมูลมากต้องมีวิธีจัดเก็บ ประมวลผล และตรวจ</text><text xml:space="preserve" x="48.188" y="699.750" textLength="120.727" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.950" font-weight="400" fill="#20333a">คุณภาพที่เหมาะกับงานด้วย</text><text xml:space="preserve" x="60.938" y="734.250" textLength="470.323" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.290" font-weight="400" fill="#20333a">ก่อนวิเคราะห์ ต้องรู้ว่า 1 แถวแทน “หนึ่งคน” หรือ “หนึ่งครั้งที่มาเรียน” เพราะคนเดียวอาจมีหลายแถว การนับแถวจึง</text><text xml:space="preserve" x="60.938" y="750.750" textLength="97.561" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.290" font-weight="400" fill="#20333a">อาจไม่เท่ากับจำนวนคน</text></svg><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 594.9600 841.9200"><rect x="48.000" y="42.750" width="498.750" height="2.250" fill="#347fb5"/><rect x="48.000" y="258.000" width="498.750" height="112.500" fill="#eaf4fb"/><rect x="48.000" y="258.000" width="2.250" height="112.500" fill="#347fb5"/><rect x="48.000" y="452.250" width="498.750" height="81.750" fill="#eaf4fb"/><rect x="48.000" y="681.000" width="498.750" height="49.500" fill="#eaf4fb"/><rect x="48.000" y="681.000" width="2.250" height="49.500" fill="#fff3d6"/><rect x="48.000" y="785.250" width="498.750" height="0.750" fill="#c6dce9"/><rect x="59.438" y="490.747" width="164.178" height="8.120" fill="#fff0b5"/><text xml:space="preserve" x="48.188" y="63.000" textLength="171.536" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="9.000" font-weight="600" fill="#245b83">ICT CHALLENGE · วิทยาการข้อมูลและ AI</text><text xml:space="preserve" x="48.188" y="96.750" textLength="384.268" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="20.250" font-weight="600" fill="#163d42">ค่าเฉลี่ย มัธยฐาน ฐานนิยม และการกระจาย</text><text xml:space="preserve" x="48.188" y="133.500" textLength="479.663" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">ค่าวัดแนวโน้มเข้าสู่ส่วนกลางช่วยบอกว่าข้อมูลอยู่แถวไหน ส่วนค่าวัดการกระจายช่วยบอกว่าแตกต่างกันมาก</text><text xml:space="preserve" x="48.188" y="151.500" textLength="337.527" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">เพียงใด ชุดข้อมูลสองชุดอาจมีค่าเฉลี่ยเท่ากันแต่ความสม่ำเสมอต่างกันมาก</text><text xml:space="preserve" x="48.188" y="183.000" textLength="153.740" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="12.750" font-weight="600" fill="#245b83">Mean, Median และ Mode</text><text xml:space="preserve" x="48.188" y="206.250" textLength="30.668" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="600" fill="#20333a">Mean</text><text xml:space="preserve" x="78.855" y="206.250" textLength="304.665" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a"> = ผลรวมข้อมูล ÷ จำนวนข้อมูล ใช้ข้อมูลทุกค่า จึงไวต่อค่าสุดโต่ง </text><text xml:space="preserve" x="383.520" y="206.250" textLength="41.141" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="600" fill="#20333a">Median</text><text xml:space="preserve" x="424.664" y="206.250" textLength="122.012" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a"> คือค่ากลางหลังเรียงข้อมูล</text><text xml:space="preserve" x="48.188" y="224.250" textLength="146.142" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">ถ้าจำนวนคู่ให้เฉลี่ยสองค่ากลาง </text><text xml:space="preserve" x="194.332" y="224.250" textLength="30.746" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="600" fill="#20333a">Mode</text><text xml:space="preserve" x="225.094" y="224.250" textLength="320.648" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a"> คือค่าที่เกิดบ่อยที่สุด อาจมีหลายฐานนิยมหรือไม่มีฐานนิยมตามนิยามที่</text><text xml:space="preserve" x="48.188" y="243.000" textLength="12.026" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">ใช้</text><text xml:space="preserve" x="60.938" y="279.000" textLength="96.164" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="600" fill="#20333a">ข้อมูล 2, 3, 3, 4, 8</text><text xml:space="preserve" x="60.938" y="302.250" textLength="145.913" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">Mean = (2+3+3+4+8)/5 = 4</text><text xml:space="preserve" x="60.938" y="321.000" textLength="179.382" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">Median = 3 เพราะเป็นตัวที่ 3 หลังเรียง</text><text xml:space="preserve" x="60.938" y="339.000" textLength="130.224" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">Mode = 3 เพราะพบสองครั้ง</text><text xml:space="preserve" x="60.938" y="357.750" textLength="88.288" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">Range = 8−2 = 6</text><text xml:space="preserve" x="48.188" y="396.750" textLength="207.264" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="12.750" font-weight="600" fill="#245b83">Variance และ Standard deviation</text><text xml:space="preserve" x="48.188" y="419.250" textLength="494.381" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">ความแปรปรวนหาค่าเบี่ยงเบนจากค่าเฉลี่ย ยกกำลังสองแล้วเฉลี่ย เพื่อไม่ให้ค่าบวกและลบหักล้างกัน ส่วนเบี่ยง</text><text xml:space="preserve" x="48.188" y="438.000" textLength="367.831" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">เบนมาตรฐานคือรากที่สองของความแปรปรวน จึงกลับมาอยู่ในหน่วยเดียวกับข้อมูล</text><text xml:space="preserve" x="59.438" y="476.250" textLength="147.589" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="600" fill="#20333a">ประชากร σ² = Σ(x−μ)² / N</text><text xml:space="preserve" x="59.438" y="497.250" textLength="164.178" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="600" fill="#20333a">ตัวอย่าง s² = Σ(x−x̄)² / (n−1)</text><text xml:space="preserve" x="59.438" y="519.000" textLength="89.797" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="600" fill="#20333a">SD = √Variance</text><text xml:space="preserve" x="48.188" y="556.500" textLength="488.970" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">จากข้อมูลข้างบน ค่าเบี่ยงเบนจาก Mean 4 คือ −2, −1, −1, 0, 4 ยกกำลังสองได้ 4, 1, 1, 0, 16 รวม 22 ถ้า</text><text xml:space="preserve" x="48.188" y="575.250" textLength="494.418" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">ถือเป็นประชากรทั้งหมด Variance = 22/5 = 4.4 และ SD ≈ 2.10 ถ้าถือเป็นตัวอย่างเพื่อประมาณประชากร ใช้</text><text xml:space="preserve" x="48.188" y="593.250" textLength="121.410" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">22/4 = 5.5 และ s ≈ 2.35</text><text xml:space="preserve" x="48.188" y="624.750" textLength="109.331" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="12.750" font-weight="600" fill="#245b83">ค่าเฉลี่ยถ่วงน้ำหนัก</text><text xml:space="preserve" x="48.188" y="648.000" textLength="490.012" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">ใช้เมื่อข้อมูลมีน้ำหนักต่างกัน สูตร = Σ(wx)/Σw เช่น คะแนนสอบ 80 น้ำหนัก 60% และงาน 90 น้ำหนัก 40%</text><text xml:space="preserve" x="48.188" y="666.000" textLength="341.891" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">ได้ 80×0.6 + 90×0.4 = 84 การเอา (80+90)/2 จะละเลยน้ำหนักที่กำหนด</text><text xml:space="preserve" x="60.938" y="701.250" textLength="461.991" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.575" font-weight="400" fill="#20333a">รายได้ที่มีคนรายได้สูงมากบางคนมักทำให้ Mean สูงขึ้น Median จึงอาจสื่อค่ากลางของคนทั่วไปได้เหมาะกว่า</text><text xml:space="preserve" x="60.938" y="718.500" textLength="374.341" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.575" font-weight="400" fill="#20333a">แต่ต้องเลือกตามคำถาม ถ้าโจทย์ถามยอดรวมจากค่าเฉลี่ย ต้องใช้ Mean × จำนวนข้อมูล</text></svg><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 594.9600 841.9200"><rect x="48.000" y="42.750" width="498.750" height="2.250" fill="#347fb5"/><rect x="48.000" y="197.250" width="498.750" height="149.250" fill="#eaf4fb"/><rect x="48.000" y="197.250" width="2.250" height="149.250" fill="#347fb5"/><rect x="48.000" y="702.000" width="498.750" height="50.250" fill="#eaf4fb"/><rect x="48.000" y="702.000" width="2.250" height="50.250" fill="#fff3d6"/><rect x="48.000" y="785.250" width="498.750" height="0.750" fill="#c6dce9"/><text xml:space="preserve" x="48.188" y="63.000" textLength="171.536" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="9.000" font-weight="600" fill="#245b83">ICT CHALLENGE · วิทยาการข้อมูลและ AI</text><text xml:space="preserve" x="48.188" y="96.750" textLength="465.802" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="20.250" font-weight="600" fill="#163d42">Quartile, Outlier, ความน่าจะเป็น และความสัมพันธ์</text><text xml:space="preserve" x="48.188" y="141.000" textLength="106.743" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="12.750" font-weight="600" fill="#245b83">Quartile และ IQR</text><text xml:space="preserve" x="48.188" y="164.250" textLength="494.352" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">Q1, Q2, Q3 แบ่งข้อมูลเรียงแล้วออกเป็นส่วน โดย Q2 คือ Median และ IQR = Q3−Q1 ใช้วัดการกระจายของ</text><text xml:space="preserve" x="48.188" y="182.250" textLength="406.578" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">ข้อมูลส่วนกลาง 50% วิธีหาควอร์ไทล์มีหลายแบบ จึงต้องทำตามวิธีในโจทย์หรือซอฟต์แวร์</text><text xml:space="preserve" x="60.938" y="218.250" textLength="183.562" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="600" fill="#20333a">ใช้วิธีมัธยฐานของครึ่งล่างและครึ่งบน</text><text xml:space="preserve" x="60.938" y="241.500" textLength="134.574" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">ข้อมูล 1, 2, 3, 4, 5, 6, 7, 20</text><text xml:space="preserve" x="60.938" y="260.250" textLength="313.034" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">Q1 = (2+3)/2 = 2.5, Q2 = (4+5)/2 = 4.5, Q3 = (6+7)/2 = 6.5</text><text xml:space="preserve" x="60.938" y="279.000" textLength="40.523" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">IQR = 4</text><text xml:space="preserve" x="60.938" y="297.000" textLength="146.859" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">ขอบล่าง = 2.5−1.5×4 = −3.5</text><text xml:space="preserve" x="60.938" y="315.750" textLength="140.861" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">ขอบบน = 6.5+1.5×4 = 12.5</text><text xml:space="preserve" x="60.938" y="333.750" textLength="268.140" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">20 เกินขอบบน จึงเป็นค่าที่ถูกธงว่าเป็น outlier ตามเกณฑ์นี้</text><text xml:space="preserve" x="48.188" y="369.750" textLength="491.344" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">Outlier อาจเกิดจากกรอกผิดหรือเป็นเหตุการณ์จริง ต้องตรวจที่มา เช่น ยอดขายวันเทศกาลสูงผิดปกติอาจเป็น</text><text xml:space="preserve" x="48.188" y="388.500" textLength="229.833" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">ข้อมูลสำคัญ การลบทิ้งทุกครั้งอาจทำให้ข้อสรุปเสีย</text><text xml:space="preserve" x="48.188" y="419.250" textLength="143.310" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="12.750" font-weight="600" fill="#245b83">Z-score และการแจกแจง</text><text xml:space="preserve" x="48.188" y="442.500" textLength="485.009" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">Z = (x−μ)/σ บอกว่าค่า x อยู่ห่างค่าเฉลี่ยกี่ SD ถ้าคะแนนเฉลี่ย 60 และ SD 10 คะแนน 80 มี Z = 2 สำหรับ</text><text xml:space="preserve" x="48.188" y="461.250" textLength="498.430" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">ข้อมูลที่แจกแจงปกติ ประมาณ 68%, 95%, 99.7% อยู่ในช่วง ±1, ±2, ±3 SD ตามลำดับ ต้องตรวจสมมติฐาน</text><text xml:space="preserve" x="48.188" y="479.250" textLength="57.477" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">ก่อนนำไปใช้</text><text xml:space="preserve" x="48.188" y="510.750" textLength="123.931" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="12.750" font-weight="600" fill="#245b83">ความน่าจะเป็นพื้นฐาน</text><text xml:space="preserve" x="48.188" y="534.000" textLength="112.601" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">P(Aᶜ)=1−P(A) และ P(A</text><text xml:space="preserve" x="160.753" y="534.000" textLength="7.661" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">∪</text><text xml:space="preserve" x="168.253" y="534.000" textLength="353.340" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">B)=P(A)+P(B)−P(A∩B) ความน่าจะเป็นมีเงื่อนไข P(A|B)=P(A∩B)/P(B) เมื่อ</text><text xml:space="preserve" x="48.188" y="552.000" textLength="229.502" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">P(B)&gt;0 ถ้า A และ B เป็นอิสระ P(A∩B)=P(A)P(B)</text><text xml:space="preserve" x="48.188" y="578.250" textLength="494.610" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">“เกิดพร้อมกันไม่ได้” กับ “เป็นอิสระ” ต่างกัน เช่น ทอยลูกเต๋าครั้งเดียวแล้วออก 1 กับออก 2 เกิดพร้อมกันไม่ได้</text><text xml:space="preserve" x="48.188" y="596.250" textLength="263.410" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">การรู้ว่าออก 1 ทำให้โอกาสออก 2 เป็นศูนย์ จึงไม่เป็นอิสระ</text><text xml:space="preserve" x="48.188" y="627.750" textLength="165.151" lengthAdjust="spacingAndGlyphs" fon " fill="#245b83">Bar chart กับ Histogram</text><text xml:space="preserve" x="48.188" y="435.000" textLength="492.500" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.800" font-weight="400" fill="#20333a">Bar chart ใช้หมวดหมู่ เช่น ห้อง ม.5/1 และ ม.5/2 ส่วน Histogram แบ่งตัวเลขต่อเนื่องเป็นช่วง เช่น คะแนน 0–9,</text><text xml:space="preserve" x="48.188" y="453.000" textLength="367.280" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.800" font-weight="400" fill="#20333a">10–19 รูปร่าง Histogram เปลี่ยนได้เมื่อปรับจำนวน Bin จึงต้องดูการแบ่งช่วงประกอบ</text><text xml:space="preserve" x="48.188" y="484.500" textLength="80.323" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="12.750" font-weight="600" fill="#245b83">อ่าน Box plot</text><text xml:space="preserve" x="48.188" y="507.000" textLength="488.819" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.800" font-weight="400" fill="#20333a">ขอบกล่องเป็น Q1 กับ Q3 เส้นกลางกล่องเป็น Median ความยาวกล่องเท่ากับ IQR หนวดอาจแสดงค่าที่อยู่ภายใน</text><text xml:space="preserve" x="48.188" y="524.250" textLength="475.023" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.800" font-weight="400" fill="#20333a">เกณฑ์ 1.5 IQR หรือใช้คำนิยามอื่นตามโปรแกรม จึงอ่านคำอธิบายก่อนสรุปว่าหนวดคือค่าต่ำสุดและสูงสุดเสมอ</text><text xml:space="preserve" x="60.938" y="559.500" textLength="106.682" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.800" font-weight="600" fill="#20333a">จับกราฟชวนเข้าใจผิด</text><text xml:space="preserve" x="60.938" y="582.000" textLength="466.406" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.800" font-weight="400" fill="#20333a">ยอดขายสองเดือน 100 กับ 110 เพิ่มจริง 10% ถ้ากราฟแท่งเริ่มแกนที่ 95 แท่งจะสูง 5 กับ 15 หน่วยบนพื้นที่</text><text xml:space="preserve" x="60.938" y="600.000" textLength="295.606" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.800" font-weight="400" fill="#20333a">ภาพ ทำให้ดูเหมือนเพิ่มสามเท่า ควรตรวจตัวเลขและแกนก่อนตีความ</text><text xml:space="preserve" x="48.188" y="639.000" textLength="188.157" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="12.750" font-weight="600" fill="#245b83">การสรุปจากกราฟอย่างระมัดระวัง</text><text xml:space="preserve" x="48.188" y="660.750" textLength="483.598" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.800" font-weight="400" fill="#20333a">ยอดผู้ป่วยมากขึ้นอาจเกิดจากประชากรมากขึ้น ควรพิจารณาอัตราต่อประชากรด้วย ค่าเฉลี่ยรวมอาจซ่อนความต่าง</text><text xml:space="preserve" x="48.188" y="678.750" textLength="461.777" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.800" font-weight="400" fill="#20333a">ระหว่างกลุ่ม และการเลือกช่วงเวลาเฉพาะอาจทำให้เห็นแนวโน้มไม่ครบ ต้องแยกจำนวนจริง ร้อยละ และการ</text><text xml:space="preserve" x="48.188" y="696.750" textLength="113.529" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.800" font-weight="400" fill="#20333a">เปลี่ยนแปลงเป็นจุดร้อยละ</text><text xml:space="preserve" x="60.938" y="730.500" textLength="431.821" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.148" font-weight="400" fill="#20333a">อัตราผ่านจาก 40% เป็น 50% เพิ่ม 10 จุดร้อยละ แต่เพิ่มสัมพัทธ์ (50−40)/40×100 = 25% คำว่า “เพิ่มกี่</text><text xml:space="preserve" x="60.938" y="747.750" textLength="143.309" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.148" font-weight="400" fill="#20333a">เปอร์เซ็นต์” ต้องอ่านฐานที่โจทย์ใช้</text></svg><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 594.9600 841.9200"><rect x="48.000" y="42.750" width="498.750" height="2.250" fill="#347fb5"/><rect x="48.000" y="467.250" width="498.750" height="60.750" fill="#eaf4fb"/><rect x="48.000" y="584.250" width="498.750" height="75.000" fill="#eaf4fb"/><rect x="48.000" y="584.250" width="2.250" height="75.000" fill="#347fb5"/><rect x="48.000" y="669.000" width="498.750" height="50.250" fill="#eaf4fb"/><rect x="48.000" y="669.000" width="2.250" height="50.250" fill="#fff3d6"/><rect x="48.000" y="785.250" width="498.750" height="0.750" fill="#c6dce9"/><rect x="60.938" y="598.747" width="177.439" height="8.120" fill="#fff0b5"/><text xml:space="preserve" x="48.188" y="63.000" textLength="171.536" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="9.000" font-weight="600" fill="#245b83">ICT CHALLENGE · วิทยาการข้อมูลและ AI</text><text xml:space="preserve" x="48.188" y="96.750" textLength="369.274" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="20.250" font-weight="600" fill="#163d42">กระบวนการทำข้อมูลและการเตรียมข้อมูล</text><text xml:space="preserve" x="48.188" y="133.500" textLength="497.263" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">วงจรงานทั่วไปเริ่มจากกำหนดปัญหา → รวบรวม → ตรวจคุณภาพและทำความสะอาด → สำรวจข้อมูล → สร้าง</text><text xml:space="preserve" x="48.188" y="151.500" textLength="482.379" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">หรือเลือกวิธีวิเคราะห์ → ประเมิน → สื่อสารและติดตามผล แต่สามารถย้อนกลับไปแก้ข้อมูลเมื่อพบปัญหาได้</text><text xml:space="preserve" x="48.188" y="183.000" textLength="87.937" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="12.750" font-weight="600" fill="#245b83">Data cleaning</text><text xml:space="preserve" x="48.188" y="206.250" textLength="76.534" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="600" fill="#20333a">Missing value</text><text xml:space="preserve" x="124.711" y="206.250" textLength="402.389" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a"> อาจลบแถว เติมค่าจากสถิติ หรือใช้วิธีเฉพาะตามสาเหตุ ต้องดูว่าขาดแบบใดและมีสัดส่วน</text><text xml:space="preserve" x="48.188" y="224.250" textLength="351.307" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">เท่าไร เช่น รายได้ไม่ตอบเพราะไม่อยากเปิดเผยอาจทำให้กลุ่มที่เหลือลำเอียง </text><text xml:space="preserve" x="399.492" y="224.250" textLength="53.617" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="600" fill="#20333a">Duplicate</text><text xml:space="preserve" x="453.105" y="224.250" textLength="78.198" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a"> ต้องตรวจคีย์และ</text><text xml:space="preserve" x="48.188" y="243.000" textLength="304.594" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">เวลาของรายการก่อนลบ เพราะการซื้อสองครั้งอาจเป็นเหตุการณ์จริง</text><text xml:space="preserve" x="48.188" y="269.250" textLength="498.836" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">แก้รูปแบบวันที่และหน่วยให้ตรงกัน เช่น 1.75 เมตรกับ 175 เซนติเมตร ตรวจค่าผิดช่วง ช่องว่าง ชื่อสะกดต่างกัน</text><text xml:space="preserve" x="48.188" y="287.250" textLength="372.934" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">และข้อมูลเชิงข้อความที่ถูกเก็บเป็นตัวเลข เช่น เบอร์โทรศัพท์ที่เลขศูนย์นำหน้าหาย</text><text xml:space="preserve" x="48.188" y="318.750" textLength="217.821" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="12.750" font-weight="600" fill="#245b83">Feature engineering และ Encoding</text><text xml:space="preserve" x="48.188" y="342.000" textLength="43.403" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="600" fill="#20333a">Feature</text><text xml:space="preserve" x="91.582" y="342.000" textLength="133.911" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a"> คือตัวแปรที่โมเดลใช้ทำนาย </text><text xml:space="preserve" x="225.492" y="342.000" textLength="73.800" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="600" fill="#20333a">Label/Target</text><text xml:space="preserve" x="299.285" y="342.000" textLength="235.277" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a"> คือค่าที่ต้องการทำนายในงาน supervised การสร้าง</text><text xml:space="preserve" x="48.188" y="360.000" textLength="481.981" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">feature เช่น แปลงวันเกิดเป็นอายุ หรือคำนวณเวลาตั้งแต่การซื้อครั้งล่าสุด ต้องใช้เฉพาะข้อมูลที่ทราบได้ ณ</text><text xml:space="preserve" x="48.188" y="378.750" textLength="53.941" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">เวลาทำนาย</text><text xml:space="preserve" x="48.188" y="404.250" textLength="101.014" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="600" fill="#20333a">One-hot encoding</text><text xml:space="preserve" x="149.215" y="404.250" textLength="387.264" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a"> แยกหมวดหมู่เป็นคอลัมน์ 0/1 เช่น สีแดง/เขียว/ฟ้า ส่วน Ordinal encoding เหมาะกับ</text><text xml:space="preserve" x="48.188" y="423.000" textLength="489.015" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">หมวดที่มีลำดับ หากให้แดง=1 เขียว=2 ฟ้า=3 โมเดลบางชนิดอาจตีความว่ามีระยะห่างหรือลำดับโดยไม่ตั้งใจ</text><text xml:space="preserve" x="48.188" y="454.500" textLength="97.729" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="12.750" font-weight="600" fill="#245b83">Feature scaling</text><text xml:space="preserve" x="59.438" y="491.250" textLength="229.747" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="600" fill="#20333a">Min–max scaling = (x−min)/(max−min)</text><text xml:space="preserve" x="59.438" y="513.000" textLength="185.276" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="600" fill="#20333a">Standardization = (x−mean)/SD</text><text xml:space="preserve" x="48.188" y="550.500" textLength="473.315" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">อายุช่วง 15–20 กับรายได้ช่วงหลักหมื่นมีสเกลต่างกัน วิธีใช้ระยะทาง เช่น k-NN หรือ K-means อาจถูกค่า</text><text xml:space="preserve" x="48.188" y="569.250" textLength="370.559" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">ขนาดใหญ่ครอบงำ จึงพิจารณาปรับสเกล ส่วนต้นไม้ตัดสินใจมักไวต่อสเกลน้อยกว่า</text><text xml:space="preserve" x="60.938" y="605.250" textLength="177.439" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="600" fill="#20333a">ป้องกันข้อมูลรั่วระหว่างเตรียมข้อมูล</text><text xml:space="preserve" x="60.938" y="628.500" textLength="453.209" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">แบ่ง Train/Test ก่อน เรียนรู้ค่าเฉลี่ยสำหรับเติมข้อมูลและค่า scaling จาก Train แล้วใช้ค่าเดียวกันกับ</text><text xml:space="preserve" x="60.938" y="647.250" textLength="417.137" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">Validation/Test หากใช้ค่าเฉลี่ยของทุกชุดตั้งแต่ต้น ข้อมูลทดสอบจะมีส่วนกำหนดขั้นตอนฝึก</text><text xml:space="preserve" x="60.938" y="689.250" textLength="469.075" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.575" font-weight="400" fill="#20333a">EDA คือการสำรวจรูปแบบและตรวจความผิดปกติ Feature selection คือเลือกตัวแปรที่มีประโยชน์ ส่วน Feature</text><text xml:space="preserve" x="60.938" y="706.500" textLength="225.110" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.575" font-weight="400" fill="#20333a">extraction เช่น PCA สร้างตัวแทนใหม่จากตัวแปรเดิม</text></svg><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 594.9600 841.9200"><rect x="48.000" y="42.750" width="498.750" height="2.250" fill="#347fb5"/><rect x="48.000" y="184.500" width="96.750" height="27.750" fill="#eaf4fb"/><rect x="144.750" y="184.500" width="199.500" height="27.750" fill="#eaf4fb"/><rect x="344.250" y="184.500" width="202.500" height="27.750" fill="#eaf4fb"/><rect x="48.000" y="212.250" width="96.750" height="0.750" fill="#c6dce9"/><rect x="144.750" y="212.250" width="199.500" height="0.750" fill="#c6dce9"/><rect x="344.250" y="212.250" width="202.500" height="0.750" fill="#c6dce9"/><rect x="48.000" y="240.000" width="96.750" height="0.750" fill="#c6dce9"/><rect x="144.750" y="240.000" width="199.500" height="0.750" fill="#c6dce9"/><rect x="344.250" y="240.000" width="202.500" height="0.750" fill="#c6dce9"/><rect x="48.000" y="268.500" width="96.750" height="0.750" fill="#c6dce9"/><rect x="144.750" y="268.500" width="199.500" height="0.750" fill="#c6dce9"/><rect x="344.250" y="268.500" width="202.500" height="0.750" fill="#c6dce9"/><rect x="48.000" y="312.750" width="96.750" height="0.750" fill="#c6dce9"/><rect x="144.750" y="312.750" width="199.500" height="0.750" fill="#c6dce9"/><rect x="344.250" y="312.750" width="202.500" height="0.750" fill="#c6dce9"/><rect x="48.000" y="357.000" width="96.750" height="0.750" fill="#c6dce9"/><rect x="144.750" y="357.000" width="199.500" height="0.750" fill="#c6dce9"/><rect x="344.250" y="357.000" width="202.500" height="0.750" fill="#c6dce9"/><rect x="48.000" y="576.000" width="498.750" height="112.500" fill="#eaf4fb"/><rect x="48.000" y="576.000" width="2.250" height="112.500" fill="#347fb5"/><rect x="48.000" y="698.250" width="498.750" height="49.500" fill="#eaf4fb"/><rect x="48.000" y="698.250" width="2.250" height="49.500" fill="#fff3d6"/><rect x="48.000" y="785.250" width="498.750" height="0.750" fill="#c6dce9"/><rect x="351.773" y="195.702" width="37.569" height="7.552" fil  y="201.750" textLength="46.796" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.462" font-weight="600" fill="#245b83">การเรียนรู้</text><text xml:space="preserve" x="151.957" y="201.750" textLength="110.719" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.462" font-weight="600" fill="#245b83">ข้อมูลหรือสัญญาณที่ใช้</text><text xml:space="preserve" x="351.773" y="201.750" textLength="37.569" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.462" font-weight="600" fill="#245b83">ตัวอย่าง</text><text xml:space="preserve" x="55.688" y="230.250" textLength="58.045" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.462" font-weight="600" fill="#20333a">Supervised</text><text xml:space="preserve" x="151.957" y="230.250" textLength="128.721" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.462" font-weight="400" fill="#20333a">ตัวอย่างพร้อมคำตอบเป้าหมาย</text><text xml:space="preserve" x="351.773" y="230.250" textLength="148.425" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.462" font-weight="400" fill="#20333a">ทำนายราคาบ้านจากราคาที่เคยขาย</text><text xml:space="preserve" x="55.688" y="258.000" textLength="71.231" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.462" font-weight="600" fill="#20333a">Unsupervised</text><text xml:space="preserve" x="151.957" y="258.000" textLength="178.069" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.462" font-weight="400" fill="#20333a">ค้นหาโครงสร้างโดยไม่มี label ของงานนั้น</text><text xml:space="preserve" x="351.773" y="258.000" textLength="135.894" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.462" font-weight="400" fill="#20333a">แบ่งลูกค้าเป็นกลุ่มจากพฤติกรรม</text><text xml:space="preserve" x="55.688" y="286.500" textLength="77.626" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.462" font-weight="600" fill="#20333a">Reinforcement</text><text xml:space="preserve" x="151.957" y="286.500" textLength="149.637" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.462" font-weight="400" fill="#20333a">ผลตอบแทนจากการกระทำในสภาพ</text><text xml:space="preserve" x="151.957" y="302.250" textLength="36.643" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.462" font-weight="400" fill="#20333a">แวดล้อม</text><text xml:space="preserve" x="351.773" y="286.500" textLength="183.542" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.462" font-weight="400" fill="#20333a">Agent เรียนรู้นโยบายเลือกการกระทำในเกม</text><text xml:space="preserve" x="55.688" y="330.750" textLength="24.505" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.462" font-weight="600" fill="#20333a">Self-</text><text xml:space="preserve" x="55.688" y="346.500" textLength="56.804" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.462" font-weight="600" fill="#20333a">supervised</text><text xml:space="preserve" x="151.957" y="330.750" textLength="146.570" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.462" font-weight="400" fill="#20333a">สร้างเป้าหมายการฝึกจากข้อมูลเอง</text><text xml:space="preserve" x="351.773" y="330.750" textLength="163.945" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.462" font-weight="400" fill="#20333a">เรียนรู้จากการคาดเดาส่วนที่หายไปของ</text><text xml:space="preserve" x="351.773" y="346.500" textLength="25.352" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.462" font-weight="400" fill="#20333a">ข้อมูล</text><text xml:space="preserve" x="48.188" y="384.000" textLength="181.008" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="12.750" font-weight="600" fill="#245b83">Classification กับ Regression</text><text xml:space="preserve" x="48.188" y="407.250" textLength="494.311" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">Classification ทำนายหมวด เช่น อีเมลเป็นสแปมหรือปกติ Regression ทำนายปริมาณ เช่น ราคาบ้านหรือเวลา</text><text xml:space="preserve" x="48.188" y="425.250" textLength="437.419" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">เดินทาง การทำนายค่าที่เขียนเป็นตัวเลขยังอาจเป็น Classification ได้ หากตัวเลขนั้นเป็นรหัสกลุ่ม</text><text xml:space="preserve" x="48.188" y="451.500" textLength="474.641" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">Clustering จัดข้อมูลคล้ายกันเข้าเป็นกลุ่มโดยไม่ได้มีคำตอบกลุ่มกำกับล่วงหน้าตามงานนั้น ส่วน Anomaly</text><text xml:space="preserve" x="48.188" y="470.250" textLength="402.109" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">detection มองหารายการที่ต่างจากรูปแบบปกติ เช่น ธุรกรรมที่มีลักษณะผิดจากประวัติเดิม</text><text xml:space="preserve" x="48.188" y="501.000" textLength="145.121" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="12.750" font-weight="600" fill="#245b83">Training และ Inference</text><text xml:space="preserve" x="48.188" y="524.250" textLength="492.085" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">Training ปรับพารามิเตอร์จากข้อมูลและเป้าหมาย Inference นำโมเดลที่ได้ไปทำนายข้อมูลใหม่ โมเดลที่ตอบ</text><text xml:space="preserve" x="48.188" y="543.000" textLength="481.179" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">เร็วขณะใช้งานอาจผ่านการฝึกที่ใช้ทรัพยากรมาก ความสามารถในชุดฝึกไม่ได้ยืนยันว่าทำได้ดีในสถานการณ์</text><text xml:space="preserve" x="48.188" y="561.000" textLength="19.249" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">ใหม่</text><text xml:space="preserve" x="60.938" y="597.000" textLength="65.716" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="600" fill="#20333a">แยกชนิดงาน</text><text xml:space="preserve" x="60.938" y="620.250" textLength="194.403" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">ทำนาย “พรุ่งนี้ขายได้กี่ชิ้น” → Regression</text><text xml:space="preserve" x="60.938" y="639.000" textLength="314.777" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">ทำนาย “ลูกค้าจะซื้อหรือไม่” จากตัวอย่างที่รู้คำตอบ → Classification</text><text xml:space="preserve" x="60.938" y="657.750" textLength="236.825" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">จัดลูกค้าที่คล้ายกันโดยยังไม่รู้ชื่อกลุ่ม → Clustering</text><text xml:space="preserve" x="60.938" y="675.750" textLength="332.406" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">เรียนรู้การเลือกเดินเพื่อให้ได้คะแนนสะสมสูง → Reinforcement learning</text><text xml:space="preserve" x="60.938" y="718.500" textLength="472.779" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.575" font-weight="400" fill="#20333a">ระบบใช้กฎ if–then ที่มนุษย์กำหนดก็อาจเป็นส่วนหนึ่งของ AI ได้ การมีคำว่า AI ในชื่อผลิตภัณฑ์จึงยังบอกไม่ได้</text><text xml:space="preserve" x="60.938" y="735.750" textLength="160.284" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.575" font-weight="400" fill="#20333a">ว่าฝึกด้วย Machine Learning ชนิดใด</text></svg><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 594.9600 841.9200"><rect x="48.000" y="42.750" width="498.750" height="2.250" fill="#347fb5"/><rect x="48.000" y="165.750" width="137.250" height="27.750" fill="#eaf4fb"/><rect x="185.250" y="165.750" width="361.500" height="27.750" fill="#eaf4fb"/><rect x="48.000" y="193.500" width="137.250" height="0.750" fill="#c6dce9"/><rect x="185.250" y="193.500" width="361.500" height="0.750" fill="#c6dce9"/> #20333a"> หรือการใช้รูปแบบที่เรียนรู้กับข้อมูลใหม่ที่เกี่ยวข้องกับงานจริง</text><text xml:space="preserve" x="48.188" y="151.500" textLength="241.767" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">จึงต้องประเมินด้วยข้อมูลที่ไม่ได้ใช้ปรับโมเดลโดยตรง</text><text xml:space="preserve" x="55.688" y="183.000" textLength="42.662" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.462" font-weight="600" fill="#245b83">ชุดข้อมูล</text><text xml:space="preserve" x="192.797" y="183.000" textLength="48.564" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.462" font-weight="600" fill="#245b83">ใช้ทำอะไร</text><text xml:space="preserve" x="55.688" y="211.500" textLength="62.514" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.462" font-weight="600" fill="#20333a">Training set</text><text xml:space="preserve" x="192.797" y="211.500" textLength="159.492" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.462" font-weight="400" fill="#20333a">ปรับพารามิเตอร์ เช่น น้ำหนักในโมเดล</text><text xml:space="preserve" x="55.688" y="240.000" textLength="72.159" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.462" font-weight="600" fill="#20333a">Validation set</text><text xml:space="preserve" x="192.797" y="240.000" textLength="214.990" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.462" font-weight="400" fill="#20333a">เลือกโมเดล ปรับ hyperparameter หรือ threshold</text><text xml:space="preserve" x="55.688" y="268.500" textLength="41.364" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.462" font-weight="600" fill="#20333a">Test set</text><text xml:space="preserve" x="192.797" y="268.500" textLength="159.263" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.462" font-weight="400" fill="#20333a">ประเมินขั้นสุดท้ายหลังตัดสินใจวิธีแล้ว</text><text xml:space="preserve" x="48.188" y="302.250" textLength="495.925" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">สัดส่วน 70/15/15 หรือ 80/10/10 เป็นตัวอย่างที่ปรับตามขนาดและธรรมชาติข้อมูลได้ ถ้าดู Test แล้วแก้โมเดล</text><text xml:space="preserve" x="48.188" y="320.250" textLength="301.865" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">ซ้ำไปมา ชุดนี้จะกลายเป็นส่วนหนึ่งของกระบวนการเลือกโดยปริยาย</text><text xml:space="preserve" x="48.188" y="351.750" textLength="177.518" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="12.750" font-weight="600" fill="#245b83">Overfitting และ Underfitting</text><text xml:space="preserve" x="48.188" y="375.000" textLength="61.470" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="600" fill="#20333a">Overfitting</text><text xml:space="preserve" x="109.641" y="375.000" textLength="426.960" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a"> โมเดลจับรายละเอียดเฉพาะหรือสัญญาณรบกวนใน Train มากเกินไป ผล Train ดีแต่ข้อมูลใหม่</text><text xml:space="preserve" x="48.188" y="393.000" textLength="16.694" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">แย่ </text><text xml:space="preserve" x="64.887" y="393.000" textLength="68.884" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="600" fill="#20333a">Underfitting</text><text xml:space="preserve" x="133.770" y="393.000" textLength="329.099" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a"> โมเดลยังจับรูปแบบสำคัญไม่ได้ ทำได้ไม่ดีทั้ง Train และข้อมูลตรวจสอบ</text><text xml:space="preserve" x="48.188" y="419.250" textLength="487.017" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">วิธีลด Overfitting เช่น ลดความซับซ้อน เพิ่มข้อมูลที่เกี่ยวข้อง ใช้ Regularization หรือ Early stopping โดย</text><text xml:space="preserve" x="48.188" y="437.250" textLength="497.517" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">ตรวจ Validation ส่วน Underfitting อาจต้องเพิ่ม feature ที่มีประโยชน์ เปลี่ยนโมเดล หรือฝึกให้เหมาะสม ต้อง</text><text xml:space="preserve" x="48.188" y="456.000" textLength="91.917" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">ดูอาการก่อนเลือกวิธี</text><text xml:space="preserve" x="48.188" y="487.500" textLength="141.061" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="12.750" font-weight="600" fill="#245b83">Data leakage ที่พบบ่อย</text><text xml:space="preserve" x="48.188" y="510.000" textLength="490.789" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">ใช้ข้อมูลหลังผลลัพธ์เกิดแล้ว เช่น ทำนายว่าจะลาออกโดยใช้ “วันสิ้นสุดการเป็นพนักงาน” หรือปล่อยข้อมูลคน</text><text xml:space="preserve" x="48.188" y="528.750" textLength="479.253" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">เดียวกันซ้ำข้ามชุด ทำให้คะแนนดูดีผิดจริง งานตามเวลาควรแบ่งตามลำดับเวลา และงานที่หลายแถวเป็นคน</text><text xml:space="preserve" x="48.188" y="547.500" textLength="151.731" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">เดียวกันควรพิจารณาแบ่งตามกลุ่ม</text><text xml:space="preserve" x="60.938" y="582.750" textLength="78.252" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="600" fill="#20333a">วิเคราะห์คะแนน</text><text xml:space="preserve" x="60.938" y="606.750" textLength="472.044" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">โมเดล A ได้ Train 99%, Validation 68% ส่วน B ได้ Train 86%, Validation 84% ภายใต้ชุดข้อมูลและ</text><text xml:space="preserve" x="60.938" y="624.750" textLength="466.245" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">ตัววัดเดียวกัน B แสดงการใช้งานกับข้อมูลใหม่ได้ดีกว่าในหลักฐานนี้ A มีช่องว่างที่ชวนตรวจ Overfitting</text><text xml:space="preserve" x="60.938" y="643.500" textLength="159.706" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">หรือความต่างของการกระจายข้อมูล</text><text xml:space="preserve" x="48.188" y="682.500" textLength="163.085" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="12.750" font-weight="600" fill="#245b83">Cross-validation และ Drift</text><text xml:space="preserve" x="48.188" y="705.000" textLength="490.499" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">k-fold cross-validation แบ่งชุดฝึกเป็น k ส่วน สลับส่วนตรวจสอบแล้วสรุปผล ช่วยประเมินความแปรปรวนของ</text><text xml:space="preserve" x="48.188" y="723.750" textLength="483.120" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">คะแนน แต่ต้องจัด preprocessing ภายในแต่ละรอบให้ถูกต้อง หลังใช้งานจริงควรตรวจ Data/Concept drift</text><text xml:space="preserve" x="48.188" y="742.500" textLength="331.432" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">เมื่อข้อมูลหรือความสัมพันธ์เปลี่ยน เช่น พฤติกรรมลูกค้าเปลี่ยนตามฤดูกาล</text></svg><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 594.9600 841.9200"><rect x="48.000" y="42.750" width="498.750" height="2.250" fill="#347fb5"/><rect x="48.000" y="123.750" width="102.000" height="27.750" fill="#eaf4fb"/><rect x="150.000" y="123.750" width="201.000" height="27.750" fill="#eaf4fb"/><rect x="351.000" y="123.750" width="195.750" height="27.750" fill="#eaf4fb"/><rect x="48.000" y="150.750" width="102.000" height="0.750" fill="#c6dce9"/><rect x="150.000" y="15 Glyphs" font-family="Prompt" font-size="10.320" font-weight="600" fill="#20333a">K-means</text><text xml:space="preserve" x="157.230" y="372.000" textLength="167.617" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.320" font-weight="400" fill="#20333a">จัดกลุ่มตาม centroid แล้วปรับศูนย์กลาง</text><text xml:space="preserve" x="358.289" y="372.000" textLength="145.928" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.320" font-weight="400" fill="#20333a">ต้องเลือก k และไวต่อสเกล/outlier</text><text xml:space="preserve" x="55.688" y="400.500" textLength="63.007" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.320" font-weight="600" fill="#20333a">Naive Bayes</text><text xml:space="preserve" x="157.230" y="400.500" textLength="168.921" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.320" font-weight="400" fill="#20333a">ใช้ความน่าจะเป็นโดยสมมติ feature เป็น</text><text xml:space="preserve" x="157.230" y="415.500" textLength="65.640" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.320" font-weight="400" fill="#20333a">อิสระเมื่อรู้คลาส</text><text xml:space="preserve" x="358.289" y="400.500" textLength="177.141" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.320" font-weight="400" fill="#20333a">มักใช้จำแนกข้อความ สมมติฐานอาจไม่ตรง</text><text xml:space="preserve" x="358.289" y="415.500" textLength="47.158" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.320" font-weight="400" fill="#20333a">จริงทั้งหมด</text><text xml:space="preserve" x="55.688" y="444.000" textLength="44.978" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.320" font-weight="600" fill="#20333a">Gradient</text><text xml:space="preserve" x="55.688" y="459.750" textLength="45.070" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.320" font-weight="600" fill="#20333a">boosting</text><text xml:space="preserve" x="157.230" y="444.000" textLength="168.690" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.320" font-weight="400" fill="#20333a">เพิ่มโมเดลย่อยตามลำดับเพื่อแก้ความผิด</text><text xml:space="preserve" x="157.230" y="459.750" textLength="46.323" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.320" font-weight="400" fill="#20333a">ของชุดเดิม</text><text xml:space="preserve" x="358.289" y="444.000" textLength="157.867" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.320" font-weight="400" fill="#20333a">ปรับจำนวนรอบและความซับซ้อนอย่าง</text><text xml:space="preserve" x="358.289" y="459.750" textLength="38.608" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.320" font-weight="400" fill="#20333a">เหมาะสม</text><text xml:space="preserve" x="55.688" y="487.500" textLength="80.746" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.320" font-weight="600" fill="#20333a">Neural network</text><text xml:space="preserve" x="157.230" y="487.500" textLength="179.394" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.320" font-weight="400" fill="#20333a">รวมหน่วยคำนวณที่มีน้ำหนักและ activation</text><text xml:space="preserve" x="358.289" y="487.500" textLength="157.582" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.320" font-weight="400" fill="#20333a">ยืดหยุ่นสูง ต้องจัดข้อมูลและการฝึกให้</text><text xml:space="preserve" x="358.289" y="503.250" textLength="26.150" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.320" font-weight="400" fill="#20333a">เหมาะ</text><text xml:space="preserve" x="60.938" y="545.250" textLength="138.244" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.100" font-weight="600" fill="#20333a">คำนวณ Linear regression</text><text xml:space="preserve" x="60.938" y="568.500" textLength="457.253" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.100" font-weight="400" fill="#20333a">โมเดลคะแนน ŷ = 10 + 5x โดย x คือชั่วโมงอ่านหนังสือ ถ้า x=6 จะได้ ŷ=40 ถ้าคะแนนจริง y=46 ค่า</text><text xml:space="preserve" x="60.938" y="586.500" textLength="437.542" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.100" font-weight="400" fill="#20333a">คลาดเคลื่อน y−ŷ = 6 และ squared error = 36 การใช้สมการกับชั่วโมงที่ไกลนอกช่วงฝึกเป็นการ</text><text xml:space="preserve" x="60.938" y="604.500" textLength="176.591" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.100" font-weight="400" fill="#20333a">extrapolate ซึ่งต้องระวังความเหมาะสม</text><text xml:space="preserve" x="60.938" y="648.000" textLength="119.871" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.100" font-weight="600" fill="#20333a">ไล่ k-NN และ K-means</text><text xml:space="preserve" x="60.938" y="671.250" textLength="442.871" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.100" font-weight="400" fill="#20333a">k-NN ที่ k=3 ได้เพื่อนบ้านคลาส A, A, B จึงโหวต A ส่วน K-means ถ้ากลุ่มหนึ่งมีจุดหนึ่งมิติ 2, 4, 9</text><text xml:space="preserve" x="60.938" y="689.250" textLength="333.632" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.100" font-weight="400" fill="#20333a">ศูนย์กลางใหม่คือ (2+4+9)/3 = 5 ทั้งสองวิธีใช้คำว่า k แต่ k แทนคนละสิ่ง</text><text xml:space="preserve" x="60.938" y="731.250" textLength="463.484" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.432" font-weight="400" fill="#20333a">Logistic regression ใช้บ่อยใน Classification แม้ชื่อมีคำว่า regression และ K-means เป็น Clustering ส่วน k-</text><text xml:space="preserve" x="60.938" y="747.750" textLength="326.201" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.432" font-weight="400" fill="#20333a">NN ใช้ได้ทั้ง Classification และ Regression ตามวิธีรวมคำตอบของเพื่อนบ้าน</text></svg><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 594.9600 841.9200"><rect x="48.000" y="42.750" width="498.750" height="2.250" fill="#347fb5"/><rect x="4
