ompt" font-size="10.050" font-weight="400" fill="#20333a">ก่อนคำนวณต้องนิยามว่าอะไรคือ </text><text xml:space="preserve" x="181.922" y="131.250" textLength="40.010" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.050" font-weight="600" fill="#20333a">Positive</text><text xml:space="preserve" x="221.930" y="131.250" textLength="309.354" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.050" font-weight="400" fill="#20333a"> เช่น “เป็นสแปม” แล้วอ่านว่าแกนตารางเป็นค่าจริงหรือค่าทำนาย เพราะแต่ละ</text><text xml:space="preserve" x="48.188" y="147.750" textLength="117.177" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.050" font-weight="400" fill="#20333a">แหล่งอาจสลับตำแหน่งกันได้</text><text xml:space="preserve" x="220.699" y="177.750" textLength="55.694" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="9.345" font-weight="600" fill="#245b83">จริง Positive</text><text xml:space="preserve" x="378.855" y="177.750" textLength="60.380" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="9.345" font-weight="600" fill="#245b83">จริง Negative</text><text xml:space="preserve" x="55.688" y="204.000" textLength="69.223" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="9.345" font-weight="600" fill="#20333a">ทำนาย Positive</text><text xml:space="preserve" x="220.699" y="204.000" textLength="56.547" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="9.345" font-weight="400" fill="#20333a">TP ตรวจพบถูก</text><text xml:space="preserve" x="378.855" y="204.000" textLength="79.672" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="9.345" font-weight="400" fill="#20333a">FP แจ้งผิดว่าเป็นบวก</text><text xml:space="preserve" x="55.688" y="231.000" textLength="73.909" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="9.345" font-weight="600" fill="#20333a">ทำนาย Negative</text><text xml:space="preserve" x="220.699" y="231.000" textLength="70.209" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="9.345" font-weight="400" fill="#20333a">FN พลาดกรณีบวก</text><text xml:space="preserve" x="378.855" y="231.000" textLength="56.775" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="9.345" font-weight="400" fill="#20333a">TN ตรวจลบถูก</text><text xml:space="preserve" x="59.438" y="273.000" textLength="195.778" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.050" font-weight="600" fill="#20333a">Accuracy = (TP+TN)/(TP+TN+FP+FN)</text><text xml:space="preserve" x="59.438" y="291.750" textLength="121.330" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.050" font-weight="600" fill="#20333a">Precision = TP/(TP+FP)</text><text xml:space="preserve" x="59.438" y="311.250" textLength="107.011" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.050" font-weight="600" fill="#20333a">Recall = TP/(TP+FN)</text><text xml:space="preserve" x="59.438" y="330.000" textLength="225.849" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.050" font-weight="600" fill="#20333a">F1 = 2×Precision×Recall/(Precision+Recall)</text><text xml:space="preserve" x="59.438" y="349.500" textLength="129.663" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.050" font-weight="600" fill="#20333a">Specificity = TN/(TN+FP)</text><text xml:space="preserve" x="48.188" y="384.750" textLength="492.747" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.050" font-weight="400" fill="#20333a">Precision ถามว่า “ที่แจ้งว่าเป็นบวก เชื่อได้กี่ส่วน” ส่วน Recall ถามว่า “กรณีบวกจริงถูกหาเจอกี่ส่วน” เลือกตัววัดจากผลกระ</text><text xml:space="preserve" x="48.188" y="401.250" textLength="200.516" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.050" font-weight="400" fill="#20333a">ทบของ FP และ FN รวมถึงสัดส่วนแต่ละคลาส [5]</text><text xml:space="preserve" x="60.938" y="435.000" textLength="68.969" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.050" font-weight="600" fill="#20333a">ตัวอย่างครบขั้น</text><text xml:space="preserve" x="60.938" y="456.750" textLength="215.150" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.050" font-weight="400" fill="#20333a">TP=40, FP=10, FN=20, TN=130 รวม 200 รายการ</text><text xml:space="preserve" x="60.938" y="473.250" textLength="123.980" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.050" font-weight="400" fill="#20333a">Accuracy = 170/200 = 85%</text><text xml:space="preserve" x="60.938" y="489.750" textLength="112.944" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.050" font-weight="400" fill="#20333a">Precision = 40/50 = 80%</text><text xml:space="preserve" x="60.938" y="506.250" textLength="113.661" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.050" font-weight="400" fill="#20333a">Recall = 40/60 ≈ 66.67%</text><text xml:space="preserve" x="60.938" y="522.750" textLength="168.126" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.050" font-weight="400" fill="#20333a">F1 = 2×40/(2×40+10+20) ≈ 72.73%</text><text xml:space="preserve" x="60.938" y="539.250" textLength="142.868" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.050" font-weight="400" fill="#20333a">Specificity = 130/140 ≈ 92.86%</text><text xml:space="preserve" x="48.188" y="578.250" textLength="195.827" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="12.750" font-weight="600" fill="#245b83">Class imbalance และ Threshold</text><text xml:space="preserve" x="48.188" y="599.250" textLength="494.086" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.050" font-weight="400" fill="#20333a">มีรายการปกติ 990 และผิดปกติ 10 ถ้าทำนายว่าปกติทั้งหมด จะได้ Accuracy 99% แต่ Recall ของผิดปกติเป็น 0% คะแนน</text><text xml:space="preserve" x="48.188" y="615.750" textLength="493.935" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.050" font-weight="400" fill="#20333a">รวมสูงจึงอาจไม่ตอบงาน หากลด threshold สำหรับประกาศ Positive โดยทั่วไปจะตรวจพบเพิ่มพร้อมกับแจ้งผิดเพิ่ม ต้องชั่ง</text><text xml:space="preserve" x="48.188" y="632.250" textLength="118.684" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.050" font-weight="400" fill="#20333a">ต้นทุนของความผิดแต่ละแบบ</text><text xml:space="preserve" x="48.188" y="663.750" textLength="117.731" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="12.750" font-weight="600" fill="#245b83">ประเมิน Regression</text><text xml:space="preserve" x="48.188" y="684.750" textLength="471.986" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.050" font-weight="400" fill="#20333a">MAE = ค่าเฉลี่ย |y−ŷ| อ่านง่ายในหน่วยเดิม MSE = ค่าเฉลี่ย (y−ŷ)² ให้น้ำหนักความผิดขนาดใหญ่สูง และ RMSE =</text><text xml:space="preserve" x="48.188" y="701.250" textLength="422.346" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.050" font-weight="400" fill="#20333a">√MSE กลับมาอยู่ในหน่วยเดิม ถ้าความผิด 1, −2, 3 จะได้ MAE=2, MSE=14/3≈4.67 และ RMSE≈2.16</text><text xml:space="preserve" x="60.938" y="735.000" textLength="469.760" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="9.443" font-weight="400" fill="#20333a">กรณีตัวส่วนเป็นศูนย์บาง metric จะนิยามไม่ได้ตามสูตร ต้องดูวิธีจัดการของโจทย์หรือเครื่องมือ การเปรียบเทียบโมเดลต้องใช้</text><text xml:space="preserve" x="60.938" y="750.000" textLength="116.355" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="9.443" font-weight="400" fill="#20333a">ชุดประเมินและเงื่อนไขเดียวกัน</text></svg><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 594.9600 841.9200"><rect x="48.000" y="42.750" width="498.750" height="2.250" fill="#347fb5"/><rect x="48.000" y="302.250" width="498.750" height="112.500" fill="#eaf4fb"/><rect x="48.000" y="302.250" width="2.250" height="112.500" fill="#347fb5"/><rect x="48.000" y="454.500" width="117.000" height="27.750" fill="#eaf4fb"/><rect x="165.000" y="454.500" width="381.750" height="27.750" fill="#eaf4fb"/><rect x="48.000" y="481.500" width="117.000" height="0.750" fill="#c6dce9"/><rect x="165.000" y="481.500" width="381.750" height="0.750" fill="#c6dce9"/><rect x="48.000" y="510.000" width="117.000" height="0.750" fill="#c6dce9"/><rect x="165.000" y="510.000" width="381.750" height="0.750" fill="#c6dce9"/><rect x="48.000" y="538.500" width="117.000" height="0.750" fill="#c6dce9"/><rect x="165.000" y="538.500" width="381.750" height="0.750" fill="#c6dce9"/><rect x="48.000" y="567.000" width="117.000" height="0.750" fill="#c6dce9"/><rect x="165.000" y="567.000" width="381.750" height="0.750" fill="#c6dce9"/><rect x="48.000" y="595.500" width="117.000" height="0.750" fill="#c6dce9"/><rect x="165.000" y="595.500" width="381.750" height="0.750" fill="#c6dce9"/><rect x="48.000" y="670.500" width="498.750" height="49.500" fill="#eaf4fb"/><rect x="48.000" y="670.500" width="2.250" height="49.500" fill="#fff3d6"/><rect x="48.000" y="785.250" width="498.750" height="0.750" fill="#c6dce9"/><rect x="60.938" y="316.747" width="101.905" height="8.120" fill="#fff0b5"/><text xml:space="preserve" x="48.188" y="63.000" textLength="171.536" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="9.000" font-weight="600" fill="#245b83">ICT CHALLENGE · วิทยาการข้อมูลและ AI</text><text xml:space="preserve" x="48.188" y="96.750" textLength="299.109" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="20.250" font-weight="600" fill="#163d42">Deep Learning และการประยุกต์</text><text xml:space="preserve" x="48.188" y="133.500" textLength="492.552" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">โครงข่ายประสาทประกอบด้วย Input layer, Hidden layers และ Output layer หน่วยหนึ่งคำนวณผลรวมถ่วงน้ำ</text><text xml:space="preserve" x="48.188" y="151.500" textLength="391.443" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">หนัก z = Σwᵢxᵢ+b แล้วผ่าน Activation function เพื่อช่วยเรียนรู้ความสัมพันธ์ที่ซับซ้อน</text><text xml:space="preserve" x="48.188" y="183.000" textLength="107.003" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="12.750" font-weight="600" fill="#245b83">การฝึกเกิดอะไรขึ้น</text><text xml:space="preserve" x="48.188" y="206.250" textLength="75.769" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="600" fill="#20333a">Forward pass</text><text xml:space="preserve" x="123.949" y="206.250" textLength="86.087" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a"> คำนวณค่าทำนาย </text><text xml:space="preserve" x="210.035" y="206.250" textLength="75.105" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="600" fill="#20333a">Loss function</text><text xml:space="preserve" x="285.152" y="206.250" textLength="101.382" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a"> วัดความคลาดเคลื่อน </text><text xml:space="preserve" x="386.531" y="206.250" textLength="95.917" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="600" fill="#20333a">Backpropagation</text><text xml:space="preserve" x="482.449" y="206.250" textLength="37.831" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a"> คำนวณ</text><text xml:space="preserve" x="48.188" y="224.250" textLength="478.382" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">gradient ผ่านโครงข่าย และ Optimizer เช่น Gradient descent ใช้ gradient ปรับน้ำหนัก โดยมี Learning</text><text xml:space="preserve" x="48.188" y="243.000" textLength="118.225" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">rate ควบคุมขนาดการปรับ</text><text xml:space="preserve" x="48.188" y="269.250" textLength="357.667" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">Learning rate ใหญ่เกินอาจทำให้ข้ามจุดเหมาะสมหรือฝึกไม่นิ่ง เล็กเกินอาจช้า </text><text xml:space="preserve" x="405.855" y="269.250" textLength="34.065" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="600" fill="#20333a">Epoch</text><text xml:space="preserve" x="439.945" y="269.250" textLength="94.623" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a"> คือการผ่านข้อมูลฝึก</text><text xml:space="preserve" x="48.188" y="287.250" textLength="60.919" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">ครบหนึ่งรอบ </text><text xml:space="preserve" x="109.113" y="287.250" textLength="32.265" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="600" fill="#20333a">Batch</text><text xml:space="preserve" x="141.375" y="287.250" textLength="395.440" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a"> คือข้อมูลกลุ่มหนึ่งที่ใช้คำนวณในแต่ละขั้น ส่วน Step มักนับการปรับพารามิเตอร์หนึ่งครั้ง</text><text xml:space="preserve" x="60.938" y="323.250" textLength="101.905" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="600" fill="#20333a">คำนวณจำนวน Step</text><text xml:space="preserve" x="60.938" y="346.500" textLength="447.738" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">Train 1,000 ตัวอย่าง, batch size 100, ฝึก 5 epochs โดยใช้ทุกตัวอย่างและปรับหนึ่งครั้งต่อ batch</text><text xml:space="preserve" x="60.938" y="365.250" textLength="174.636" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">หนึ่ง epoch มี 1,000/100 = 10 steps</text><text xml:space="preserve" x="60.938" y="384.000" textLength="104.130" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">รวม 5×10 = 50 steps</text><text xml:space="preserve" x="60.938" y="402.000" textLength="246.556" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">ถ้าหารไม่ลงตัวต้องดูว่าระบบเก็บหรือทิ้ง batch สุดท้าย</text><text xml:space="preserve" x="48.188" y="441.000" textLength="124.863" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="12.750" font-weight="600" fill="#245b83">สถาปัตยกรรมและงาน</text><text xml:space="preserve" x="55.688" y="471.750" textLength="33.651" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.462" font-weight="600" fill="#245b83">แนวคิด</text><text xml:space="preserve" x="172.430" y="471.750" textLength="30.979" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.462" font-weight="600" fill="#245b83">การใช้</text><text xml:space="preserve" x="55.688" y="499.500" textLength="23.112" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.462" font-weight="600" fill="#20333a">CNN</text><text xml:space="preserve" x="172.430" y="499.500" textLength="215.457" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.462" font-weight="400" fill="#20333a">เรียนรู้รูปแบบเชิงพื้นที่ เช่น ขอบและลักษณะในภาพ</text><text xml:space="preserve" x="55.688" y="528.000" textLength="64.251" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.462" font-weight="600" fill="#20333a">RNN / LSTM</text><text xml:space="preserve" x="172.430" y="528.000" textLength="154.982" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.462" font-weight="400" fill="#20333a">ประมวลผลลำดับและสถานะตามเวลา</text><text xml:space="preserve" x="55.688" y="556.500" textLength="65.012" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.462" font-weight="600" fill="#20333a">Transformer</text><text xml:space="preserve" x="172.430" y="556.500" textLength="330.006" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.462" font-weight="400" fill="#20333a">ใช้ Attention ประกอบข้อมูลจากตำแหน่งต่าง ๆ ใช้กับภาษา ภาพ และหลายสื่อ</text><text xml:space="preserve" x="55.688" y="585.000" textLength="90.403" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.462" font-weight="600" fill="#20333a">Transfer learning</text><text xml:space="preserve" x="172.430" y="585.000" textLength="209.284" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.462" font-weight="400" fill="#20333a">นำความรู้จากโมเดลที่ฝึกแล้วมาปรับใช้กับงานใหม่</text><text xml:space="preserve" x="48.188" y="618.750" textLength="113.591" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="600" fill="#20333a">Image classification</text><text xml:space="preserve" x="161.766" y="618.750" textLength="102.780" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a"> บอกประเภทของภาพ </text><text xml:space="preserve" x="264.551" y="618.750" textLength="93.712" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="600" fill="#20333a">Object detection</text><text xml:space="preserve" x="358.254" y="618.750" textLength="132.784" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a"> ระบุตำแหน่งและประเภทวัตถุ</text><text xml:space="preserve" x="48.188" y="637.500" textLength="79.133" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="600" fill="#20333a">Segmentation</text><text xml:space="preserve" x="127.312" y="637.500" textLength="407.316" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a"> แบ่งพื้นที่ระดับพิกเซล ส่วนงาน NLP เช่น วิเคราะห์ความรู้สึก แปลภาษา และสกัดชื่อบุคคล</text><text xml:space="preserve" x="48.188" y="655.500" textLength="273.996" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">ระบบแนะนำอาจใช้พฤติกรรมผู้ใช้หรือคุณลักษณะของรายการ</text><text xml:space="preserve" x="60.938" y="690.750" textLength="466.716" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.575" font-weight="400" fill="#20333a">Dropout และการเพิ่มข้อมูลฝึกด้วยการแปลงที่เหมาะสมเป็นตัวอย่างวิธีช่วยลด Overfitting การแปลงต้องรักษา</text><text xml:space="preserve" x="60.938" y="708.000" textLength="285.806" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.575" font-weight="400" fill="#20333a">ความหมาย label เช่น หมุนภาพบางชนิดอาจทำให้คำตอบเปลี่ยนได้</text></svg><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 594.9600 841.9200"><rect x="48.000" y="42.750" width="498.750" height="2.250" fill="#347fb5"/><rect x="48.000" y="411.750" width="498.750" height="93.750" fill="#eaf4fb"/><rect x="48.000" y="411.750" width="2.250" height="93.750" fill="#347fb5"/><rect x="48.000" y="672.000" width="498.750" height="49.500" fill="#eaf4fb"/><rect x="48.000" y="672.000" width="2.250" height="49.500" fill="#fff3d6"/><rect x="48.000" y="785.250" width="498.750" height="0.750" fill="#c6dce9"/><text xml:space="preserve" x="48.188" y="63.000" textLength="171.536" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="9.000" font-weight="600" fill="#245b83">ICT CHALLENGE · วิทยาการข้อมูลและ AI</text><text xml:space="preserve" x="48.188" y="96.750" textLength="316.791" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="20.250" font-weight="600" fill="#163d42">Generative AI, LLM และ Prompt</text><text xml:space="preserve" x="48.188" y="133.500" textLength="497.095" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">Generative AI สร้างเนื้อหา เช่น ข้อความ ภาพ เสียง หรือวิดีโอจากรูปแบบที่เรียนรู้ LLM เป็นโมเดลภาษาขนาด</text><text xml:space="preserve" x="48.188" y="151.500" textLength="488.496" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">ใหญ่ที่มักสร้างข้อความทีละ token ตามบริบท Token อาจเป็นส่วนคำ คำ หรือสัญลักษณ์ จำนวน token จึงไม่</text><text xml:space="preserve" x="48.188" y="170.250" textLength="237.926" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">เท่ากับจำนวนคำเสมอ โดยเฉพาะเมื่อเทียบข้ามภาษา</text><text xml:space="preserve" x="48.188" y="201.750" textLength="219.887" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="12.750" font-weight="600" fill="#245b83">Context, Embedding และ Attention</text><text xml:space="preserve" x="48.188" y="224.250" textLength="92.419" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="600" fill="#20333a">Context window</text><text xml:space="preserve" x="140.613" y="224.250" textLength="211.628" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a"> จำกัดปริมาณ token ที่โมเดลรับใช้ในครั้งหนึ่ง </text><text xml:space="preserve" x="352.242" y="224.250" textLength="63.270" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="600" fill="#20333a">Embedding</text><text xml:space="preserve" x="415.523" y="224.250" textLength="117.385" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a"> แทนข้อมูลด้วยเวกเตอร์ที่</text><text xml:space="preserve" x="48.188" y="243.000" textLength="183.514" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">สะท้อนความสัมพันธ์ที่โมเดลเรียนรู้ ส่วน </text><text xml:space="preserve" x="231.703" y="243.000" textLength="53.167" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="600" fill="#20333a">Attention</text><text xml:space="preserve" x="284.859" y="243.000" textLength="246.021" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a"> ช่วยกำหนดน้ำหนักความเกี่ยวข้องระหว่างองค์ประกอบ</text><text xml:space="preserve" x="48.188" y="261.750" textLength="46.387" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">ของข้อมูล</text><text xml:space="preserve" x="48.188" y="287.250" textLength="491.773" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">Temperature เป็นพารามิเตอร์การสุ่มเลือกผลลัพธ์ในระบบที่รองรับ ค่าสูงมักเพิ่มความหลากหลาย แต่ความถูก</text><text xml:space="preserve" x="48.188" y="306.000" textLength="275.104" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">ต้องไม่ได้รับประกันด้วยการลด temperature เพียงอย่างเดียว</text><text xml:space="preserve" x="48.188" y="336.750" textLength="197.729" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="12.750" font-weight="600" fill="#245b83">องค์ประกอบของ Prompt ที่ชัดเจน</text><text xml:space="preserve" x="48.188" y="360.000" textLength="485.203" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">ระบุงาน บริบท ข้อมูลนำเข้า ข้อจำกัด และรูปแบบผลลัพธ์ เช่น “สรุปบทความนี้สำหรับนักเรียน ม.ปลาย 5 ข้อ</text><text xml:space="preserve" x="48.188" y="378.750" textLength="490.154" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">อ้างเฉพาะข้อมูลในบทความ ระบุจุดที่บทความไม่ได้ให้คำตอบ” ตัวอย่างผลลัพธ์ที่ต้องการช่วยลดความกำกวม</text><text xml:space="preserve" x="48.188" y="396.750" textLength="12.667" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">ได้</text><text xml:space="preserve" x="60.938" y="432.750" textLength="114.530" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="600" fill="#20333a">เปลี่ยนคำสั่งให้ตรวจได้</text><text xml:space="preserve" x="60.938" y="456.750" textLength="254.357" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">คำสั่งกว้าง “วิเคราะห์ข้อมูลให้หน่อย” ยังไม่ระบุเป้าหมาย</text><text xml:space="preserve" x="60.938" y="474.750" textLength="465.331" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">คำสั่งชัด “จากตารางยอดขายที่แนบ เปรียบเทียบรายเดือน คำนวณการเปลี่ยนแปลงร้อยละจากเดือนก่อน</text><text xml:space="preserve" x="60.938" y="493.500" textLength="251.989" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">ระบุเดือนที่ข้อมูลขาด และสรุปเป็นตารางพร้อมสูตรที่ใช้”</text><text xml:space="preserve" x="48.188" y="528.750" textLength="54.979" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="600" fill="#20333a">Zero-shot</text><text xml:space="preserve" x="103.160" y="528.750" textLength="199.380" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a"> ให้คำสั่งโดยไม่มีตัวอย่างเฉพาะใน prompt </text><text xml:space="preserve" x="302.543" y="528.750" textLength="52.695" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="600" fill="#20333a">Few-shot</text><text xml:space="preserve" x="355.230" y="528.750" textLength="184.382" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a"> ให้ตัวอย่างจำนวนหนึ่งเพื่อชี้รูปแบบ ส่วน</text><text xml:space="preserve" x="48.188" y="547.500" textLength="489.203" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">การขอให้แสดงสูตรหรือหลักฐานที่ตรวจสอบได้ช่วยให้ผู้ใช้ประเมินคำตอบได้ แต่ยังต้องตรวจผลลัพธ์กับแหล่ง</text><text xml:space="preserve" x="48.188" y="565.500" textLength="16.620" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">จริง</text><text xml:space="preserve" x="48.188" y="597.000" textLength="84.788" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="12.750" font-weight="600" fill="#245b83">Hallucination</text><text xml:space="preserve" x="48.188" y="620.250" textLength="469.751" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">โมเดลอาจสร้างข้อความที่ดูน่าเชื่อแต่ผิด เช่น ชื่อบทความหรือแหล่งอ้างอิงที่ไม่มีจริง ต้องเปิดตรวจแหล่ง</text><text xml:space="preserve" x="48.188" y="638.250" textLength="476.847" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">คำนวณซ้ำ และยืนยันข้อมูลสำคัญ โดยเฉพาะเรื่องที่เปลี่ยนตามเวลา การตอบมั่นใจหรือเขียนยาวไม่ได้บอก</text><text xml:space="preserve" x="48.188" y="657.000" textLength="56.998" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">ความถูกต้อง</text><text xml:space="preserve" x="60.938" y="692.250" textLength="460.269" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.575" font-weight="400" fill="#20333a">คำสั่ง “ห้ามผิด” ไม่ใช่กลไกตรวจสอบ ควรให้ข้อมูลต้นทางที่เหมาะสม กำหนดรูปแบบอ้างอิง และตรวจข้อเท็จ</text><text xml:space="preserve" x="60.938" y="709.500" textLength="107.954" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.575" font-weight="400" fill="#20333a">จริงที่มีผลต่อการตัดสินใจ</text></svg><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 594.9600 841.9200"><rect x="48.000" y="42.750" width="498.750" height="2.250" fill="#347fb5"/><rect x="48.000" y="154.500" width="78.000" height="27.750" fill="#eaf4fb"/><rect x="126.000" y="154.500" width="188.250" height="27.750" fill="#eaf4fb"/><rect x="314.250" y="154.500" width="232.500" height="27.750" fill="#eaf4fb"/><rect x="48.000" y="181.500" width="78.000" height="0.750" fill="#c6 pt" font-size="10.800" font-weight="600" fill="#20333a">ดาวน์โหลดใช้เวลาเท่าไร</text><text xml:space="preserve" x="60.938" y="238.500" textLength="238.487" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.800" font-weight="400" fill="#20333a">ไฟล์ 750 MB ผ่านลิงก์ 100 Mbps โดยใช้หน่วยฐานสิบ</text><text xml:space="preserve" x="60.938" y="256.500" textLength="159.265" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.800" font-weight="400" fill="#20333a">ขนาด = 750×8 = 6,000 megabits</text><text xml:space="preserve" x="60.938" y="274.500" textLength="185.527" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.800" font-weight="400" fill="#20333a">เวลาตามทฤษฎี = 6,000/100 = 60 วินาที</text><text xml:space="preserve" x="60.938" y="291.750" textLength="341.284" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.800" font-weight="400" fill="#20333a">เวลาจริงอาจมากขึ้นจาก overhead การแบ่งใช้เครือข่าย และความเร็วเซิร์ฟเวอร์</text><text xml:space="preserve" x="48.188" y="330.750" textLength="147.860" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="12.750" font-weight="600" fill="#245b83">เลขฐานสองและฐานสิบหก</text><text xml:space="preserve" x="48.188" y="353.250" textLength="496.640" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.800" font-weight="400" fill="#20333a">ฐานสองใช้ 0 และ 1 แต่ละหลักมีน้ำหนัก 1, 2, 4, 8, 16, ... ฐานสิบหกใช้ 0–9 และ A–F โดย A=10 ถึง F=15 หนึ่ง</text><text xml:space="preserve" x="48.188" y="370.500" textLength="144.906" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.800" font-weight="400" fill="#20333a">หลักฐานสิบหกแทน 4 บิตได้พอดี</text><text xml:space="preserve" x="59.438" y="408.000" textLength="163.708" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.800" font-weight="600" fill="#20333a">101101₂ = 32+8+4+1 = 45₁₀</text><text xml:space="preserve" x="59.438" y="428.250" textLength="105.864" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.800" font-weight="600" fill="#20333a">0010 1101₂ = 2D₁₆</text><text xml:space="preserve" x="59.438" y="449.250" textLength="183.839" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.800" font-weight="600" fill="#20333a">8 บิตแทนรูปแบบได้ 2⁸ = 256 รูปแบบ</text><text xml:space="preserve" x="59.438" y="469.500" textLength="228.686" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.800" font-weight="600" fill="#20333a">จำนวนเต็มไม่ติดเครื่องหมาย 8 บิตมีช่วง 0–255</text><text xml:space="preserve" x="48.188" y="510.750" textLength="160.508" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="12.750" font-weight="600" fill="#245b83">การแทนข้อมูลและการบีบอัด</text><text xml:space="preserve" x="48.188" y="533.250" textLength="494.177" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.800" font-weight="400" fill="#20333a">Unicode กำหนดรหัสอักขระ ส่วน UTF-8 เป็นรูปแบบเข้ารหัสอักขระที่ใช้จำนวนไบต์แปรผัน จึงไม่ควรสมมติว่าอักษร</text><text xml:space="preserve" x="48.188" y="551.250" textLength="488.712" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.800" font-weight="400" fill="#20333a">ทุกตัวใช้ 1 byte ภาพ Raster ประกอบด้วยพิกเซล ส่วน Vector เก็บรูปทรงหรือเส้นตามโครงสร้างทางคณิตศาสตร์</text><text xml:space="preserve" x="48.188" y="576.750" textLength="462.984" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.800" font-weight="400" fill="#20333a">Lossless compression กู้ข้อมูลเดิมได้ครบ เช่น ZIP หรือ PNG ส่วน Lossy ยอมสูญรายละเอียดบางส่วนเพื่อ</text><text xml:space="preserve" x="48.188" y="594.000" textLength="445.751" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.800" font-weight="400" fill="#20333a">ประหยัดพื้นที่ เช่น JPEG และ MP3 โดยทั่วไป การบีบอัดไฟล์ที่ถูกบีบอัดมาดีแล้วอาจลดขนาดได้ไม่มาก</text><text xml:space="preserve" x="60.938" y="629.250" textLength="64.730" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.800" font-weight="600" fill="#20333a">ขนาดภาพดิบ</text><text xml:space="preserve" x="60.938" y="651.750" textLength="213.567" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.800" font-weight="400" fill="#20333a">ภาพ 1920×1080 พิกเซล RGB 24 บิตต่อพิกเซล</text><text xml:space="preserve" x="60.938" y="669.750" textLength="250.189" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.800" font-weight="400" fill="#20333a">ขนาด = 1920×1080×24/8 = 6,220,800 B ≈ 6.22 MB</text><text xml:space="preserve" x="60.938" y="687.750" textLength="271.772" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.800" font-weight="400" fill="#20333a">เป็นค่าก่อนบีบอัดและยังไม่รวมส่วนหัวหรือ metadata ของไฟล์</text><text xml:space="preserve" x="60.938" y="729.000" textLength="467.987" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.148" font-weight="400" fill="#20333a">นามสกุลช่วยบอกประเภทที่คาดไว้ แต่การเปลี่ยน .jpg เป็น .pdf ไม่ได้แปลงรูปแบบข้อมูลจริง ต้องใช้เครื่องมือแปลง</text><text xml:space="preserve" x="60.938" y="745.500" textLength="51.928" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.148" font-weight="400" fill="#20333a">ไฟล์ที่รองรับ</text></svg><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 594.9600 841.9200"><rect x="48.000" y="42.750" width="498.750" height="2.250" fill="#347fb5"/><rect x="48.000" y="165.750" width="498.750" height="75.000" fill="#eaf4fb"/><rect x="48.000" y="165.750" width="2.250" height="75.000" fill="#347fb5"/><rect x="48.000" y="326.250" width="147.000" height="28.500" fill="#eaf4fb"/><rect x="195.000" y="326.250" width="187.500" height="28.500" fill="#eaf4fb"/><rect x="382.500" y="326.250" width="164.250" height="28.500" fill="#eaf4fb"/><rect x="48.000" y="354.000" width="147.000" height="0.750" fill="#c6dce9"/><rect x="195.000" y="354.000" width="187.500" height="0.750" fill="#c6dce9"/><rect x="382.500" y="354.000" width="164.250" height t-weight="400" fill="#20333a"> แสดงเฉพาะแถวที่ตรงเงื่อนไขโดยข้อมูลอื่นยังอยู่ </text><text xml:space="preserve" x="466.043" y="164.250" textLength="59.737" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="600" fill="#20333a">PivotTable</text><text xml:space="preserve" x="48.188" y="182.250" textLength="473.821" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">สรุปข้อมูลตามกลุ่ม เช่น ผลรวมยอดขายแยกแผนกและเดือน ควรตรวจว่าค่าที่สรุปเป็น SUM, COUNT หรือ</text><text xml:space="preserve" x="48.188" y="201.000" textLength="47.022" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">AVERAGE</text><text xml:space="preserve" x="48.188" y="226.500" textLength="490.471" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">การ Sort เฉพาะคอลัมน์ชื่อโดยไม่ขยายไปทั้งตารางอาจทำให้ชื่อสลับจากคะแนนเดิม ควรเก็บหนึ่งแถวต่อหนึ่ง</text><text xml:space="preserve" x="48.188" y="245.250" textLength="366.758" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">รายการ หัวคอลัมน์ชัดเจน หน่วยสม่ำเสมอ และหลีกเลี่ยงการรวมเซลล์ในข้อมูลดิบ</text><text xml:space="preserve" x="48.188" y="276.750" textLength="155.167" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="12.750" font-weight="600" fill="#245b83">รวมแบบมีเงื่อนไขและค้นหา</text><text xml:space="preserve" x="48.188" y="299.250" textLength="493.038" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">=SUMIF(A2:A10,&quot;ห้อง 1&quot;,B2:B10) รวมค่า B เฉพาะแถวที่ A เป็นห้อง 1 ส่วน COUNTIFS/SUMIFS ใช้หลาย</text><text xml:space="preserve" x="48.188" y="318.000" textLength="472.128" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">เงื่อนไขร่วมกัน ฟังก์ชันค้นหา เช่น XLOOKUP หรือ VLOOKUP ต้องกำหนดการจับคู่และตรวจคีย์ซ้ำก่อนใช้</text><text xml:space="preserve" x="60.938" y="354.000" textLength="98.572" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="600" fill="#20333a">การค้นหารหัสสินค้า</text><text xml:space="preserve" x="60.938" y="377.250" textLength="467.768" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">ต้องการราคาของรหัส S102 ควรค้นหาแบบตรงกันแน่นอน หากใช้ VLOOKUP ในบริบทที่ต้องตรงรหัส ให้</text><text xml:space="preserve" x="60.938" y="396.000" textLength="466.615" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">ระบุ exact match เช่น FALSE ในอาร์กิวเมนต์ที่เกี่ยวข้อง การใช้ approximate match โดยไม่เข้าใจอาจ</text><text xml:space="preserve" x="60.938" y="414.000" textLength="88.376" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">คืนราคาของรหัสอื่น</text><text xml:space="preserve" x="48.188" y="453.000" textLength="272.825" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="12.750" font-weight="600" fill="#245b83">Data validation และ Conditional formatting</text><text xml:space="preserve" x="48.188" y="476.250" textLength="461.454" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">Data validation ช่วยจำกัดค่าที่กรอก เช่น เลือกชื่อห้องจากรายการ หรือรับคะแนน 0–100 Conditional</text><text xml:space="preserve" x="48.188" y="494.250" textLength="487.861" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">formatting เปลี่ยนรูปแบบตามเงื่อนไข เช่น ทำสีคะแนนต่ำกว่า 50 ทั้งสองอย่างมีหน้าที่ต่างกัน การทำสีเพียง</text><text xml:space="preserve" x="48.188" y="513.000" textLength="142.721" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">อย่างเดียวยังไม่ได้ห้ามกรอกผิด</text><text xml:space="preserve" x="48.188" y="544.500" textLength="120.953" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="12.750" font-weight="600" fill="#245b83">ตรวจผลลัพธ์ก่อนเชื่อ</text><text xml:space="preserve" x="48.188" y="567.000" textLength="490.044" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">ตรวจตัวเลขที่เก็บเป็นข้อความ ค่า 0 ที่ต่างจากช่องว่าง ช่วงสูตรที่ตกแถวใหม่ และวันที่สลับวันกับเดือน การใช้</text><text xml:space="preserve" x="48.188" y="585.750" textLength="425.239" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">COUNT เพื่อตรวจจำนวนข้อมูล และเทียบยอดรวมก่อน/หลังจัดตาราง ช่วยจับปัญหาเบื้องต้นได้</text><text xml:space="preserve" x="60.938" y="621.000" textLength="102.104" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="600" fill="#20333a">ค่าเฉลี่ยจากสองห้อง</text><text xml:space="preserve" x="60.938" y="645.000" textLength="230.132" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">ห้อง A มี 10 คนเฉลี่ย 80 ห้อง B มี 30 คนเฉลี่ย 60</text><text xml:space="preserve" x="60.938" y="663.750" textLength="211.932" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">เฉลี่ยรวม = (10×80+30×60)/(10+30) = 65</text><text xml:space="preserve" x="60.938" y="681.750" textLength="319.461" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">การเฉลี่ยค่า 80 กับ 60 ตรง ๆ ได้ 70 ซึ่งละเลยจำนวนคนของแต่ละห้อง</text><text xml:space="preserve" x="60.938" y="724.500" textLength="469.489" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.575" font-weight="400" fill="#20333a">PivotTable บางระบบต้อง Refresh เมื่อข้อมูลเปลี่ยน และ Filter ธรรมดาไม่ได้ทำให้ SUM ทุกสูตรนับเฉพาะแถว</text><text xml:space="preserve" x="60.938" y="741.750" textLength="250.767" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.575" font-weight="400" fill="#20333a">ที่มองเห็น ต้องเลือกฟังก์ชันหรือการสรุปที่ตรงความต้องการ</text></svg><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 594.9600 841.9200"><rect x="48.000" y="42.750" width="498.750" height="2.250" fill="#347fb5"/><rect x="48.000" y="423.750" width="498.750" height="75.750" fill="#eaf4fb"/><rect x="48.000" y="423.750" width="2.250" height="75.750" fill="#347fb5"/><rect x="48.000" y="645.000" width="498.750" height="49.500" fill="#eaf4fb"/><rect x="48.000" y="645.000" width="2.250" height="49.500" fill="#fff3d6"/><rect x="48.000" y="785.250" width="498.750" height="0.750" fill="#c6dce9"/><text xml:space="preserve" x="48.188" y="63.000" textLength="235.488" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="9.000" font-weight="600" fill="#245b83">ICT CHALLENGE · พื้นฐาน IT และประสิทธิภาพการทำงาน</text><text xml:space="preserve" x="48.188" y="96.750" textLength="380.425" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="20.250" font-weight="600" fill="#163d42">เอกสาร งานนำเสนอ และการทำงานร่วมกัน</text><text xml:space="preserve" x="48.188" y="141.000" textLength="162.104" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="12.750" font-weight="600" fill="#245b83">เอกสารที่แก้ไขและค้นหาง่าย</text><text xml:space="preserve" x="48.188" y="164.250" textLength="495.706" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">ใช้ Heading styles เพื่อกำหนดโครงสร้างหัวข้อ สร้างสารบัญอัตโนมัติ และช่วยการเข้าถึง ใช้ Page break เมื่อ</text><text xml:space="preserve" x="48.188" y="182.250" textLength="481.011" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">ต้องเริ่มหน้าใหม่ และใช้ Section break เมื่อต้องเปลี่ยนรูปแบบเฉพาะส่วน เช่น แนวกระดาษหรือหัวกระดาษ</text><text xml:space="preserve" x="48.188" y="208.500" textLength= .107" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">กว้าง ต้องตรวจทั้งสิทธิ์ในโฟลเดอร์ การสืบทอดสิทธิ์ และลิงก์แชร์ที่มีอยู่ ตั้งวันหมดอายุเมื่อระบบรองรับและ</text><text xml:space="preserve" x="48.188" y="409.500" textLength="60.169" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">เหมาะกับงาน</text><text xml:space="preserve" x="60.938" y="444.750" textLength="79.487" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="600" fill="#20333a">ส่งรายงานให้ครู</text><text xml:space="preserve" x="60.938" y="468.750" textLength="475.578" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">เก็บไฟล์หลักในพื้นที่ทีม ให้เพื่อนร่วมทำเป็น Editor ให้ครูเป็น Viewer หรือ Commenter ตามงาน ตรวจว่า</text><text xml:space="preserve" x="60.938" y="486.750" textLength="372.082" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">ไฟล์เปิดได้ด้วยบัญชีที่ถูกต้อง และใช้ Version history หากต้องย้อนการแก้ไขที่ผิด</text><text xml:space="preserve" x="48.188" y="525.750" textLength="144.192" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="12.750" font-weight="600" fill="#245b83">อีเมลและการสื่อสารในทีม</text><text xml:space="preserve" x="48.188" y="549.000" textLength="477.380" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">To คือผู้รับหลัก Cc ส่งสำเนาให้ผู้เกี่ยวข้อง และ Bcc ซ่อนรายการผู้รับ Bcc จากผู้รับอื่นตามพฤติกรรมบริการ</text><text xml:space="preserve" x="48.188" y="567.000" textLength="493.472" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">ทั่วไป การใช้ Reply all ควรพิจารณาว่าทุกคนจำเป็นต้องได้รับหรือไม่ เขียนหัวเรื่องที่ระบุงาน กำหนดเวลา และ</text><text xml:space="preserve" x="48.188" y="585.750" textLength="1 " font-family="Prompt" font-size="9.900" font-weight="400" fill="#20333a">RPA โดยตรวจความเปลี่ยนแปลงของหน้าจอ</text><text xml:space="preserve" x="48.188" y="584.250" textLength="238.913" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="12.750" font-weight="600" fill="#245b83">ทำให้ตรวจสอบและกู้จากความผิดพลาดได้</text><text xml:space="preserve" x="48.188" y="606.750" textLength="489.446" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.650" font-weight="400" fill="#20333a">บันทึกสถานะและเวลา ตรวจอินพุต กำหนดเจ้าของงาน และจัดการกรณีส่งซ้ำหรือขาดการเชื่อมต่อ การใช้บัญชีเชื่อม</text><text xml:space="preserve" x="48.188" y="624.000" textLength="496.303" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.650" font-weight="400" fill="#20333a">ต่อควรมีสิทธิ์เท่าที่งานต้องใช้ หากทำสิ่งที่ส่งผลต่อคนจำนวนมาก เช่น ส่งประกาศหรือเปลี่ยนสิทธิ์ อาจมีขั้นตรวจทาน</text><text xml:space="preserve" x="48.188" y="642.000" textLength="63.549" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.650" font-weight="400" fill="#20333a">ก่อนดำเนินการ</text><text xml:space="preserve" x="48.188" y="666.750" textLength="468.164" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.650" font-weight="400" fill="#20333a">วัดประสิทธิภาพจากเวลาที่ลดลง ความผิดพลาดที่ลดลง และคุณภาพงาน เช่น งานเดิมใช้ 8 นาทีต่อรายการ 50</text><text xml:space="preserve" x="48.188" y="684.000" textLength="498.493" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.650" font-weight="400" fill="#20333a">รายการรวม 400 นาที หากระบบใหม่ใช้เวลาคนตรวจรวม 60 นาที จะลดเวลาคนทำได้ 340 นาทีต่อรอบ โดยยังต้องคิด</text><text xml:space="preserve" x="48.188" y="701.250" textLength="125.142" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.650" font-weight="400" fill="#20333a">เวลาตั้งค่าและบำรุงรักษาด้วย</text><text xml:space="preserve" x="60.938" y="735.000" textLength="474.801" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.005" font-weight="400" fill="#20333a">ระบบที่ทำซ้ำได้เร็วจะทำข้อผิดพลาดซ้ำได้เร็วเช่นกัน จึงทดสอบกรณีข้อมูลปกติ ข้อมูลขาด รายการซ้ำ และบริการปลาย</text><text xml:space="preserve" x="60.938" y="751.500" textLength="109.540" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="10.005" font-weight="400" fill="#20333a">ทางล้มเหลวก่อนใช้งานจริง</text></svg><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 594.9600 841.9200"><rect x="48.000" y="42.750" width="498.750" height="2.250" fill="#347fb5"/><rect x="66.750" y="211.500" width="480.000" height="0.750" fill="#c6dce9"/><rect x="66.750" y="258.750" width="480.000" height="0.750" fill="#c6dce9"/><rect x="66.750" y="306.750" width="480.000" height="0.750" fill="#c6dce9"/><rect x="66.750" y="354.000" width="480.000" height="0.750" fill="#c6dce9"/><rect x="66.750" y="420.750" width="480.000" height="0.750" fill="#c6dce9"/><rect x="66.750" y="468.000" width="480.000" height="0.750" fill="#c6dce9"/><rect x="66.750" y="534.000" width="480.000" height="0.750" fill="#c6dce9"/><rect x="66.750" y="600.750" width="480.000" height="0.750" fill="#c6dce9"/><rect x="48.000" y="785.250" width="498.750" height="0.750" fill="#c6dce9"/><text xml:space="preserve" x="48.188" y="63.000" textLength="250.510" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="9.000" font-weight="600" fill="#245b83">ICT CHALLENGE · แบบทบทวน • เครือข่ายและความปลอดภัย</text><text xml:space="preserve" x="48.188" y="96.750" textLength="199.430" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="20.250" font-weight="600" fill="#163d42">ลองตอบก่อนเปิดเฉลย</text><text xml:space="preserve" x="48.188" y="130.500" textLength="306.883" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="9.000" font-weight="400" fill="#597078">ข้อ 8 เลือกได้หลายคำตอบ • ใช้เวลาตามที่สะดวก แล้วอธิบายเหตุผลสั้น ๆ ก่อนตรวจ</text><text xml:space="preserve" x="53.871" y="165.000" textLength="481.619" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">1. เครื่องใน LAN ติดต่อกันได้ แต่เปิดเว็บไซต์ด้วยชื่อไม่ได้ ขณะทดสอบปลายทางที่รู้ IP ยังเชื่อมต่อได้ ควร</text><text xml:space="preserve" x="66.938" y="183.750" textLength="84.523" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">ตรวจบริการใดก่อน</text><text xml:space="preserve" x="53.871" y="231.750" textLength="336.336" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">2. 192.168.5.128/27 มี Network, Broadcast และช่วงใช้งานทั่วไปเท่าไร</text><text xml:space="preserve" x="53.871" y="279.000" textLength="320.901" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">3. ดิสก์ 4 ลูก ลูกละ 3 TB ทำ RAID 5 ได้ความจุเท่าไร และทนเสียกี่ลูก</text><text xml:space="preserve" x="53.977" y="327.000" textLength="337.992" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">4. โรงเรียนใช้ระบบอีเมลผ่านเว็บโดยผู้ให้บริการดูแลแอป เป็นบริการแบบใด</text><text xml:space="preserve" x="53.871" y="374.250" textLength="465.156" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">5. นักเรียนเข้าสู่ระบบได้ แต่เปิดคะแนนของเพื่อนไม่ได้ อธิบายด้วย Authentication และ Authorization</text><text xml:space="preserve" x="66.938" y="393.000" textLength="34.777" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">อย่างไร</text><text xml:space="preserve" x="53.871" y="441.000" textLength="306.247" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">6. รหัสผ่านกับ PIN ที่ต้องจำทั้งสองค่าเป็น MFA สองประเภทหรือไม่</text><text xml:space="preserve" x="54.691" y="488.250" textLength="491.401" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">7. ไฟล์ถูก ransomware เข้ารหัสแล้ว Sync ทับคลาวด์ ระบบไม่มีประวัติรุ่น ควรเตรียมมาตรการใดล่วงหน้าเพื่อ</text><text xml:space="preserve" x="66.938" y="507.000" textLength="37.002" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">กู้เนื้อหา</text><text xml:space="preserve" x="53.871" y="554.250" textLength="478.758" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">8. เลือกทุกข้อที่ถูก A Router ส่งข้ามเครือข่าย B DHCP แจกค่าเครือข่าย C HTTPS ยืนยันว่าเนื้อหาเว็บจริง</text><text xml:space="preserve" x="66.938" y="573.000" textLength="167.457" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">ทั้งหมด D RAID 0 ทนดิสก์เสีย 1 ลูก</text></svg><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 594.9600 841.9200"><rect x="48.000" y="42.750" width="498.750" height="2.250" fill="#347fb5"/><rect x="66.750" y="162.750" width="480.000" height="0.750" fill="#c6dce9"/><rect x="66.750" y="201.000" width="480.000" height="0.750" fill="#c6dce9"/><rect x="66.750" y="239.250" width="480.000" height="0.750" fill="#c6dce9"/><rect x="66.750" y="276.750" width="480.000" height="0.750" fill="#c6dce9"/><rect x="66.750" y="315.000" width="480.000" height="0.750" fill="#c6dce9"/><rect x="66.750" y="352.500" width="480.000" height="0.750" fill="#c6dce9"/><rect x="66.750" y="390.750" width="480.000" height="0.750" fill="#c6dce9"/><rect x="66.750" y="429.000" width="480.000" height="0.750" fill="#c6dce9"/><rect x="48.000" y="785.250" width="498.750" height="0.750" fill="#c6dce9"/><text xml:space="preserve" x="48.188" y="63.000" textLength="223.352" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="9.000" font-weight="600" fill="#245b83">ICT CHALLENGE · เฉลย • เครือข่ายและความปลอดภัย</text><text xml:space="preserve" x="48.188" y="96.750" textLength="163.680" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="20.250" font-weight="600" fill="#163d42">คำตอบและเหตุผล</text><text xml:space="preserve" x="53.871" y="147.000" textLength="421.352" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">1. DNS เพราะการแปลงชื่ออาจผิดพลาด ต้องตรวจหลักฐานอื่นร่วมด้วยก่อนสรุปสาเหตุทั้งหมด</text><text xml:space="preserve" x="53.871" y="184.500" textLength="427.802" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">2. เหลือ 5 บิต มี 32 ที่อยู่ Network=.128, Broadcast=.159, ใช้งาน .129–.158 รวม 30 ที่อยู่</text><text xml:space="preserve" x="53.871" y="222.750" textLength="229.764" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">3. (4−1)×3 = 9 TB ตามทฤษฎี ทนดิสก์เสีย 1 ลูก</text><text xml:space="preserve" x="53.977" y="261.000" textLength="206.976" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">4. SaaS เพราะใช้แอปสำเร็จรูปของผู้ให้บริการ</text><text xml:space="preserve" x="53.871" y="298.500" textLength="387.018" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">5. Authentication ผ่านแล้ว ส่วน Authorization จำกัดสิทธิ์ให้ดูเฉพาะข้อมูลที่อนุญาต</text><text xml:space="preserve" x="53.871" y="336.750" textLength="428.684" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">6. ยังเป็นปัจจัยประเภทความรู้เหมือนกัน การมีสองขั้นตอนไม่ได้ยืนยันว่าเป็นหลายประเภทปัจจัย</text><text xml:space="preserve" x="54.691" y="374.250" textLength="414.024" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">7. สำรองแยกที่ผู้โจมตีเขียนทับไม่ได้ เช่น Offline/Immutable ตามระบบ พร้อมทดสอบกู้คืน</text><text xml:space="preserve" x="53.871" y="412.500" textLength="417.055" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">8. A และ B ถูก C เกินความสามารถของ HTTPS ส่วน D ผิดเพราะ RAID 0 ไม่มี redundancy</text></svg><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 594.9600 841.9200"><rect x="48.000" y="42.750" width="498.750" height="2.250" fill="#347fb5"/><rect x="66.750" y="192.750" width="480.000" height="0.750" fill="#c6dce9"/><rect x="66.750" y="240.750" width="480.000" height="0.750" fill="#c6dce9"/><rect x="66.750" y="288.000" width="480.000" height="0.750" fill="#c6dce9"/><rect x="66.750" y="336.000" width="480.000" height="0.750" fill="#c6dce9"/><rect x="66.750" y="383.250" width="480.000" height="0.750" fill="#c6dce9"/><rect x="66.750" y="431.250" width="480.000" height="0.750" fill="#c6dce9"/><rect x="66.750" y="479.250" width="480.000" height="0.750" fill="#c6dce9"/><rect x="66.750" y="545.250" width="480.000" height="0.750" fill="#c6dce9"/><rect x="48.000" y="785.250" width="498.750" height="0.750" fill="#c6dce9"/><text xml:space="preserve" x="48.188" y="63.000" textLength="230.603" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="9.000" font-weight="600" fill="#245b83">ICT CHALLENGE · แบบทบทวน • วิทยาการข้อมูลและ AI</text><text xml:space="preserve" x="48.188" y="96.750" textLength="199.430" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="20.250" font-weight="600" fill="#163d42">ลองตอบก่อนเปิดเฉลย</text><text xml:space="preserve" x="48.188" y="130.500" textLength="306.883" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="9.000" font-weight="400" fill="#597078">ข้อ 8 เลือกได้หลายคำตอบ • ใช้เวลาตามที่สะดวก แล้วอธิบายเหตุผลสั้น ๆ ก่อนตรวจ</text><text xml:space="preserve" x="53.871" y="165.000" textLength="250.428" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">1. ข้อมูล 2, 4, 4, 6, 9 มี Mean, Median, Mode เท่าไร</text><text xml:space="preserve" x="53.871" y="213.000" textLength="318.130" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">2. ข้อมูล 2, 4, 6 ถือเป็นประชากรทั้งหมด จงหาความแปรปรวนและ SD</text><text xml:space="preserve" x="53.871" y="261.000" textLength="361.477" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">3. ต้องเปรียบเทียบการกระจายคะแนนหลายห้องและดูมัธยฐาน ใช้กราฟใดเหมาะ</text><text xml:space="preserve" x="53.977" y="308.250" textLength="301.770" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">4. หาค่าเฉลี่ยเติมข้อมูลจากทั้ง Train และ Test ก่อนฝึก มีปัญหาใด</text><text xml:space="preserve" x="53.871" y="356.250" textLength="367.105" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">5. TP=30, FP=10, FN=20, TN=40 จงหา Accuracy, Precision, Recall และ F1</text><text xml:space="preserve" x="53.871" y="403.500" textLength="350.114" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">6. Train 98% แต่ Validation 65% ควรตรวจปัญหาใด และให้สองแนวทางแก้</text><text xml:space="preserve" x="54.691" y="451.500" textLength="440.639" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">7. แชตบอตต้องตอบจากระเบียบที่เปลี่ยนทุกสัปดาห์ วิธีใดช่วยนำเอกสารใหม่เข้าบริบทได้ตรงที่สุด</text><text xml:space="preserve" x="53.871" y="499.500" textLength="483.854" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">8. เลือกทุกข้อที่ถูก A Correlation ยืนยันเหตุผล B k-NN ต้องพิจารณาสเกล C LLM อาจแต่งแหล่งอ้างอิง D</text><text xml:space="preserve" x="66.938" y="517.500" textLength="152.393" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">K-means ต้องมี label จริงทุกแถว</text></svg><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 594.9600 841.9200"><rect x="48.000" y="42.750" width="498.750" height="2.250" fill="#347fb5"/><rect x="66.750" y="162.750" width="480.000" height="0.750" fill="#c6dce9"/><rect x="66.750" y="201.000" width="480.000" height="0.750" fill="#c6dce9"/><rect x="66.750" y="239.250" width="480.000" height="0.750" fill="#c6dce9"/><rect x="66.750" y="295.500" width="480.000" height="0.750" fill="#c6dce9"/><rect x="66.750" y="351.750" width="480.000" height="0.750" fill="#c6dce9"/><rect x="66.750" y="408.000" width="480.000" height="0.750" fill="#c6dce9"/><rect x="66.750" y="446.250" width="480.000" height="0.750" fill="#c6dce9"/><rect x="66.750" y="483.750" width="480.000" height="0.750" fill="#c6dce9"/><rect x="48.000" y="785.250" width="498.750" height="0.750" fill="#c6dce9"/><text xml:space="preserve" x="48.188" y="63.000" textLength="203.445" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="9.000" font-weight="600" fill="#245b83">ICT CHALLENGE · เฉลย • วิทยาการข้อมูลและ AI</text><text xml:space="preserve" x="48.188" y="96.750" textLength="163.680" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="20.250" font-weight="600" fill="#163d42">คำตอบและเหตุผล</text><text xml:space="preserve" x="53.871" y="147.000" textLength="189.950" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">1. Mean=25/5=5, Median=4, Mode=4</text><text xml:space="preserve" x="53.871" y="184.500" textLength="438.542" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">2. Mean=4 ผลรวมกำลังสองของส่วนเบี่ยงเบน=4+0+4=8 Variance=8/3≈2.67 และ SD≈1.63</text><text xml:space="preserve" x="53.871" y="222.750" textLength="392.590" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">3. Box plot ช่วยเทียบ Median, IQR และค่าผิดปกติ โดยอ่านนิยามหนวดของกราฟด้วย</text><text xml:space="preserve" x="53.977" y="261.000" textLength="487.584" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">4. Data leakage เพราะสถิติของ Test มีส่วนกำหนด preprocessing ควรเรียนรู้จาก Train แล้วนำไปใช้กับชุด</text><text xml:space="preserve" x="66.938" y="279.000" textLength="13.581" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">อื่น</text><text xml:space="preserve" x="53.871" y="317.250" textLength="354.526" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">5. รวม100 Accuracy=70%, Precision=30/40=75%, Recall=30/50=60%,</text><text xml:space="preserve" x="66.938" y="335.250" textLength="145.789" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">F1=60/(60+10+20)=66.67%</text><text xml:space="preserve" x="53.871" y="373.500" textLength="483.226" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">6. ตรวจ Overfitting และความต่างของข้อมูล แนวทางเช่นลดความซับซ้อน ใช้ Regularization เพิ่มข้อมูลที่</text><text xml:space="preserve" x="66.938" y="392.250" textLength="124.974" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">เหมาะ หรือ Early stopping</text><text xml:space="preserve" x="54.691" y="429.750" textLength="472.942" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">7. RAG ช่วยค้นเอกสารล่าสุดเข้าบริบท ต้องตรวจเวอร์ชันเอกสาร การค้น และความถูกต้องของคำตอบด้วย</text><text xml:space="preserve" x="53.871" y="468.000" textLength="482.853" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">8. B และ C ถูก A สรุปเกินหลักฐาน D ผิดเพราะ K-means เป็นวิธี Clustering แบบไม่มี label กำกับตามงาน</text></svg><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 594.9600 841.9200"><rect x="48.000" y="42.750" width="498.750" height s" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">3. ผู้บริหารต้องดูภาพรวมแนวโน้มคู่แข่งเพื่อวางกลยุทธ์ จัดอยู่ในระบบใดตามการแบ่งพื้นฐาน</text><text xml:space="preserve" x="53.977" y="308.250" textLength="286.622" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">4. คัดลอกสูตร =$A2*B$1 จาก B2 ไป D4 สูตรเปลี่ยนเป็นอะไร</text><text xml:space="preserve" x="53.871" y="356.250" textLength="376.678" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">5. A1:A4 มี 10, 20, คำว่า ขาด, และเซลล์ว่างจริง COUNT และ COUNTA ได้เท่าไร</text><text xml:space="preserve" x="53.871" y="403.500" textLength="475.312" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">6. ต้องการเห็นเฉพาะรายการห้อง 2 โดยยังเก็บข้อมูลห้องอื่น และต้องการรวมยอดตามห้อง ใช้เครื่องมือใด</text><text xml:space="preserve" x="66.938" y="422.250" textLength="45.512" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">ตามลำดับ</text><text xml:space="preserve" x="54.691" y="470.250" textLength="279.074" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">7. ถอน Editor จากเพื่อนแล้วแต่เขายังแก้ได้ ควรตรวจอะไรต่อ</text><text xml:space="preserve" x="53.871" y="517.500" textLength="468.395" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">8. เลือกทุกข้อที่ถูก A เปลี่ยน .jpg เป็น .pdf เท่ากับแปลงไฟล์ B Trigger คือเหตุเริ่มงาน C Alt text ช่วย</text><text xml:space="preserve" x="66.938" y="536.250" textLength="224.404" lengthAdjust="spacingAndGlyphs" font-family="Prompt" font-size="11.250" font-weight="400" fill="#20333a">อธิบายภาพ D Sync ทุกแบบกู้รุ่นก่อนหน้าได้เสมอ</text></svg><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 594.9600 841.9200"><rect x="48.000" y="42.750" width="
